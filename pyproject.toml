[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-data-contract"
version = "0.1.0"
description = "Portable dataset, audio-record, prompt, and download-state contracts."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema[format]", "pytest", "ruff"]
preparation = ["requests", "lhotse==1.33.0", "soundfile", "textgrid", "numpy", "scipy"]
duration = ["orjson>=3.10", "rapidgzip>=0.16", "soundfile>=0.13"]

[project.scripts]
audio-data-contract = "audio_data_contract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audio_data_contract = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
