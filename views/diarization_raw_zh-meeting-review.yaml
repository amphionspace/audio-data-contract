      - name: time-offset-estimate
        version: v1-20261010
        kind: annotate
        writes:
          - metadata.time_offset
          - metadata.correction_decision
        parameters:
          thresholds:
            A_GAIN: 0.05
            B_PAIRS: 20
            B_CI: 0.1
            C_PEAK: 10.0
            TOLERANCE: 0.1
            MIN_SHIFT: 0.1
          rule: "Decide per-meeting annotation shifts / exclusions and write corrected references.\n\nMethods (all: positive = speech in the training audio is later than the labels):\n  (a) envelope lag of far ch0 energy vs annotated turns (far-field audit method);\n      strong when its correlation gain (peak - zero-lag) >= A_GAIN.\n  (b) MOSS-vs-human matched-utterance offset (median, bootstrap CI, corpus bias\n      removed); strong when >= B_PAIRS pairs and CI width <= B_CI.\n  (c) AliMeeting only, diagnostic:
            GCC-PHAT lag headset tracks -> far ch0;\n      strong when the peak/mean ratio >= C_PEAK.\nRule (user-approved): shift a meeting only when (a) and (b) are both strong,\nagree within TOLERANCE, the teacher offset is constant over the meeting (medians\nof the three time thirds within TOLERANCE) and their mean is >= MIN_SHIFT; exclude a meeting when it\nis not shifted but any strong method says |offset| >= MIN_SHIFT; otherwise keep.\nTOLERANCE = 0.1 s: headset tracks, which are close-talk and aligned,
            still show\nenvelope lags of +0.08..0.125 s in rooms R1019/R1021 (≈0 elsewhere), so the\nenvelope method alone carries up to ~0.1 s of room/annotation-style bias.\nUsage: corrections.py <subset>"
          shifted_meetings: 0
          shifted_hours: 0.0
          excluded_meetings: 3
          excluded_hours: 1.709
          tool: amphiondata multispeaker corrections (scripts/corrections.py, offsets.py)
