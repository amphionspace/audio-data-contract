# 葡语热词评测集 pt-v1：与西语 es-v1（recipe-es-v1.yaml）同一做法，对应中英 v3-20261020 里的 cv_zh / cv_en。脚本 build_pt.py，只用 CPU。
#
# 每条记录存好固定的列表（metadata.bias_lists，顺序已打乱），评测器另跑不给列表的 none 条件：
# - gold：只有正确词；
# - k50：正确词 + 每个正确词最多 3 个近音/近形词 + 同 split 正确词池的随机词，补到 50 个；
# - k50_no_gold：同一批干扰词去掉正确词再补满 50 个，测"说的词不在列表里"时的误触发。
# 近音词与西语相同地不经 LLM：在葡语热词（测试集正确词 + 葡语训练集热词标注）里按葡语读音键（巴西读法：ç/ce/ci→s、nh、lh、ch/x、
# rr 与词首 r、qu/gu、h 不发音、鼻元音、词尾 l→u、词尾 e/o→i/u 等）的编辑距离检索出的真实词；没有葡语现网词库，不做 pool50；不含 hotword_types。
version: pt-v1-20261117
dataset_id: hotword_bench
seed: 20261117
sample_rate: 16000
list_size: 50
confusables_per_word: 3
local_positive_cap: 2000
min_seconds: 0.1
max_seconds: 120.0

# 葡语热词标注（Qwen3.8-27B 抽取 + 复核，scripts/ts_hotwords/label_hotwords.py；与西语同一提示词与设置）。
# 每行 {id, text, source, source_id, hotwords, ...}；source_id 为 supervision id。FLEURS 同一句话有多个说话人，标注按文本去重，
# 按 supervision id 找不到时按完全相同的文本取
labels:
  path: ts_asr_hotwords/versions/pt-v1-20261117/hotword-labels.jsonl
  sha256: 7e47bc8970802638b2c6000ed5acdbd256d34afe3ba109af9d79ae05b5bfb2ba

# 路径相对 /workspace/data/datasets；数据源与葡语训练版本说话人、句子零重叠（common_voice_pt / mls_pt / fleurs_pt @pt-eval-v1-20261117 的 overlap.json）
sources:
  cv_pt:
    label_source: common_voice_pt
    dataset: common_voice_pt@pt-eval-v1-20261117:test
    recordings: common_voice_pt/versions/pt-eval-v1-20261117/manifests/cv27-pt_recordings_test.jsonl.gz
    supervisions: common_voice_pt/versions/pt-eval-v1-20261117/manifests/cv27-pt_supervisions_test.jsonl.gz
    # 9,707 条里 2,397 条含热词，取前 2,000 条（同西语）
    min_records: 2000
  fleurs_pt:
    label_source: fleurs_pt
    dataset: fleurs_pt@pt-eval-v1-20261117:test
    recordings: fleurs_pt/versions/pt-eval-v1-20261117/manifests/fleurs-pt_recordings_test.jsonl.gz
    supervisions: fleurs_pt/versions/pt-eval-v1-20261117/manifests/fleurs-pt_supervisions_test.jsonl.gz
    # 919 条录音里 382 条含热词（147 句不同的话）；下限约为其 85%，同西语（362 条设 300）
    min_records: 330
  mls_pt:
    label_source: mls_pt
    dataset: mls_pt@pt-eval-v1-20261117:test
    recordings: mls_pt/versions/pt-eval-v1-20261117/manifests/mls-portuguese_recordings_test.jsonl.gz
    # 与葡语普通 ASR 评测同一份转写（原标注全小写无标点），热词标注也在这份文本上做
    supervisions: mls_pt/versions/pt-eval-v1-20261117/manifests/mls-portuguese_supervisions_test.jsonl.gz
    # 871 条里 292 条含热词（MLS pt test 只有西语的约三分之一）；下限约为其 85%
    min_records: 250

# 近音词：候选词表 = 三个测试集的正确词 + 葡语训练集已有的热词标注（只当干扰词用，不改训练数据）
confusables:
  vocabulary:
    - common_voice_pt/versions/pt-train-v1-20261117/cv27-pt_supervisions_train.jsonl.gz
    - mls_pt/versions/pt-train-v1-20261117/mls-portuguese_supervisions_train.jsonl.gz
  min_count: 2
  min_key_length: 4
  max_distance: [[6, 1], [10, 2], [999, 3]]

# 训练重叠：规范化文本与这些训练转写完全相同的条目在 labels.train_text_overlap 标出来源（不隔离；pt-eval-v1 已核对为 0）
overlap:
  supervisions:
    - common_voice_pt/versions/pt-train-v1-20261117/cv27-pt_supervisions_train.jsonl.gz
    - mls_pt/versions/pt-train-v1-20261117/mls-portuguese_supervisions_train.jsonl.gz

# 质检门槛（按 split，同西语）：不满足时非零退出、不登记
qc:
  max_quarantine_fraction: 0.02
  min_gold_with_confusable: 0.3
  max_duration_drift: 0.1
