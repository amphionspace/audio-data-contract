# 葡语普通 ASR 背景人声评测集：与西语版 recipe-es.yaml（es-v1-20261111）同一做法、参数与随机种子，对应中英 v2-20261023 的
# *-babble-* / *-clean 切分（eval-set asr-babble-bench@v4-20261104），渲染函数和参数与 recipe.yaml 相同，只换语言。只建与语言有关的切分：真实人群声（crowd-wham / crowd-fsd）、
# 空白与非人声（v3-20261104）与语言无关，评测集直接沿用中英版本的那几列。
version: pt-v1-20261117
dataset_id: asr_babble_bench
seed: 20261111
sample_rate: 16000
speech_dbfs: -25.0
padding_seconds: [1.0, 5.0]
description: >-
  葡萄牙语普通 ASR 背景人声评测集（与西语版 es-v1-20261111 同一做法，对应中英 v2-20261023 的背景人声切分，同一渲染函数与参数）：
  只有葡语背景人声的片段（期望输出为空），以及一句话前后和说话时都有葡语背景人声的片段（与无背景人声的对照逐条配对）。
  目标语音是 Common Voice 27.0 pt test 的一句话；背景人声由不进训练、也不与目标重叠的 Common Voice 27.0 pt dev 和 MLS pt dev / test（20 人）
  说话人在模拟房间里混成（葡语训练 common_voice_pt / mls_pt @pt-train-v1-20261117 只用 train，且与这些划分说话人、句子零重叠）。
  只用于评测，不进训练。配方 scripts/asr_babble_bench/recipe-pt.yaml。

# 被转写的语音：test 划分，一条记录一句完整的话（文本小写、去标点后只剩葡语字母、连字符和空格的句子）
targets:
  pt:
    sources:
      - {dataset: common_voice_pt, version: pt-eval-v1-20261117, split: test}
    seconds: [2.0, 12.0]

# 背景人声说话人：葡语训练只用了 CV pt / MLS pt 的 train（没有葡语背景人声训练数据），这里取 dev / test 划分；
# CV 各划分说话人不重叠（pt-eval-v1 登记时已核对），build.py 另外检查与目标说话人不重叠
babble:
  pt:
    sources:
      - {dataset: common_voice_pt, version: pt-eval-v1-20261117, split: dev}
      - {dataset: mls_pt, version: pt-eval-v1-20261117, split: dev}
      - {dataset: mls_pt, version: pt-eval-v1-20261117, split: test}
    clips: 300
babble_clip_seconds: 30.0
babble_talkers: [16, 24]
babble_gain_db: [-3.0, 3.0]
babble_gap_seconds: [0.1, 0.8]
babble_min_utterances: 3
babble_rir: {dataset: sim_rir_slr28, version: legacy-20260804, split: all, rooms: [mediumroom, largeroom]}

noise_floor: {dbfs: [-65, -55], kinds: [white, pink]}

default_n: 200

# 质检门槛（按切分）：不满足时非零退出、不登记
qc:
  # 只有背景人声的片段：整段电平应落在切分的 level_dbfs 内（噪声底比背景低 10 dB 以上，几乎不改变电平）
  level_tolerance_db: 1.0
  # 带背景人声的句子：前面的空白只有背景人声，电平约为 speech_dbfs − snr（同一段背景的另一窗口，人声起伏 ±几 dB）
  padding_tolerance_db: 3.0
  # 对照切分的前面空白只有噪声底（−65 到 −55 dBFS）
  clean_padding_max_dbfs: -50.0
  # 至少这么多条记录有 ≥ 0.5 s 的前空白可测（padding 1–5 s，应为全部）
  min_measured_fraction: 0.95

splits:
  - {name: pt-babble-far, kind: noise, pair: pt-babble-only, noise: babble_pt, level_dbfs: [-45, -38], duration: [2, 20],
     display: 只有葡语背景人声 · 远, description: "16–24 人在房间里同时说话的葡语背景人声，电平 −45 到 −38 dBFS（正常说话约 −25 dBFS），2–20 秒；期望输出为空"}
  - {name: pt-babble-mid, kind: noise, pair: pt-babble-only, noise: babble_pt, level_dbfs: [-38, -31], duration: [2, 20],
     display: 只有葡语背景人声 · 中, description: "同一批片段，电平 −38 到 −31 dBFS；期望输出为空"}
  - {name: pt-clean, kind: speech, pair: pt-speech, language: pt,
     display: 葡语 · 无背景人声（对照）, description: "Common Voice 27.0 pt 测试集的一句话，前后各 1–5 秒只有很低的噪声底；下面几列与它逐条配对"}
  - {name: pt-babble20, kind: speech, pair: pt-speech, language: pt, noise: babble_pt, snr_db: 20,
     display: 葡语 · 背景人声 20 dB, description: "同一句话、同样的前后时长，整段叠加葡语背景人声，信噪比 20 dB（背景很远）；前后 1–5 秒只有背景人声"}
  - {name: pt-babble10, kind: speech, pair: pt-speech, language: pt, noise: babble_pt, snr_db: 10,
     display: 葡语 · 背景人声 10 dB, description: "同上，信噪比 10 dB（身边有一群人在聊天）"}
  - {name: pt-babble5, kind: speech, pair: pt-speech, language: pt, noise: babble_pt, snr_db: 5,
     display: 葡语 · 背景人声 5 dB, description: "同上，信噪比 5 dB（嘈杂的人群）"}
  - {name: pt-babble10-tight, kind: speech, pair: pt-speech, language: pt, tight: true, noise: babble_pt, snr_db: 10,
     display: 葡语 · 背景人声 10 dB · 无前后空白, description: "与 pt-babble10 同一句话、同一段背景，只是没有前后 1–5 秒；两列之差就是只有背景人声的那几秒带来的错误"}
