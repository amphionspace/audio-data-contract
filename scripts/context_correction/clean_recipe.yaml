# 上下文纠偏清洗（context_correction_clean_zh）：训练数据里说话人讲字怎么写（组词、拆字、偏旁、否定对比）的句子，
# 标注要按说明写。两个不同家族的 LLM 独立判定，代码只做机械校验（只改说明涉及的字、读音不变）；拿不准的隔离，不删除。
version: v1-20261110
dataset_id: context_correction_clean_zh
out: /workspace/data/datasets/context_correction_clean_zh/versions/v1-20261110
run_dir: /workspace/workspace/mingdong/data/amphiondata/ctx-clean-zh-20261110
# 改正后的训练数据：各来源的派生版本 <原版本>-<derived_suffix>，写在 data_root/datasets/<id>/versions/ 下
data_root: /workspace/data
derived_suffix: ctxclean-20261110
# 音频核对读 Lance 发布时用的登记
catalog: /workspace/data/registry/catalog
roots: /workspace/data/registry/roots.json

# 扫描单位：同一录音相邻分段拼窗，与 mine.py 相同（播客的窗口和 10 月扫描逐个相同，可直接复用扫描结果）
window_seconds: 25.0
max_gap_seconds: 2.0

llm:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: ALI_API_KEY          # amphionkeys aliyun-llm
  # 全量扫描与 10 月播客扫描同一模型；规则候选用同一模型小批量复核
  scan: {model: qwen3.6-27b, extra_body: {enable_thinking: false}, temperature: 0.0, max_tokens: 256}
  scan_batch: 20
  rescan_batch: 5
  # 两个不同家族的判定模型，各自独立写出按说明修正后的转写
  judges:
    qwen: {model: qwen3.6-plus, extra_body: {enable_thinking: true}, max_tokens: 16000}
    deepseek: {model: deepseek-v4-pro, temperature: 0.0, max_tokens: 16000}
  workers: 16

# 音频核对（Qwen3-ASR）：每段说明连同两侧各 audio_context_syllables 个音节，与识别结果的无调拼音编辑数不超过 audio_max_edits；
# 说明旁边漏了或多了字（"似舞蹈的舞" 实为 "似乎的似，舞蹈的舞"）会失败，同音字的写法不影响
audio_context_syllables: 3
audio_max_edits: 2   # 漏掉一句 "Y的X" 至少 3 个音节；1–2 个多出的语气词（"哎呀"）不算

# 评测集用过的源录音，不进训练
exclude_recordings:
  wenetspeech_podcast: /workspace/data/datasets/context_correction_zh/source/v1-20261018/excluded-recordings.txt
# 抽检判错或存疑的窗口（unit_id<TAB>理由），同文本的窗口一起隔离、也不再捞回；评审只能把窗口改判为隔离，不能新增改正
review_rejected:
  wenetspeech_podcast: /workspace/data/datasets/context_correction_clean_zh/versions/v1-20261110/wenetspeech_podcast/review-rejected.tsv
  emilia2_mix: /workspace/data/datasets/context_correction_clean_zh/versions/v1-20261110/emilia2_mix/review-rejected.tsv
  wenetspeech_youtube: /workspace/data/datasets/context_correction_clean_zh/versions/v1-20261110/wenetspeech_youtube/review-rejected.tsv
  emilia2_dialog: /workspace/data/datasets/context_correction_clean_zh/versions/v1-20261110/emilia2_dialog/review-rejected.tsv
  emilia2_short: /workspace/data/datasets/context_correction_clean_zh/versions/v1-20261110/emilia2_short/review-rejected.tsv

sources:
  wenetspeech_podcast:
    kind: lhotse
    dataset: wenetspeech_podcast@l-20261014
    split: train
    supervisions: /workspace/data/datasets/wenetspeech_podcast/versions/l-20261014/supervisions/train.jsonl.gz
    recordings: /workspace/data/datasets/wenetspeech_podcast/versions/l-20261014/recordings/train.jsonl.gz
    reuse_scan: /workspace/data/datasets/context_correction_zh/source/v1-20261018/mined/wenetspeech_podcast/scan.jsonl
    reuse_windows: /workspace/data/datasets/context_correction_zh/source/v1-20261018/mined/wenetspeech_podcast/windows.jsonl.gz
  wenetspeech_youtube:
    kind: lhotse
    dataset: wenetspeech_youtube@l-20261014
    split: train
    supervisions: /workspace/data/datasets/wenetspeech_youtube/versions/l-20261014/supervisions/train.jsonl.gz
    recordings: /workspace/data/datasets/wenetspeech_youtube/versions/l-20261014/recordings/train.jsonl.gz
    reuse_windows: /workspace/data/datasets/context_correction_zh/source/v1-20261018/mined/wenetspeech_youtube/windows.jsonl.gz
  # 音频记录来源：每条记录是一个训练样本，按目标文本判定（同文本的记录共用判定）；records 列出全部训练划分，派生版本照抄，只判中文
  # audio：核对音频取哪里（primary 单人片段；mixture 混合窗口；mix_protocol 混音协议里目标说话人的干净源音频）
  # exclude_records：ts_asr_real 留出的评测源录音，派生版本里一并去掉（记录 ID 不变，原名单照样可用）
  emilia2_short:
    kind: records
    dataset: emilia2_short@short-20261014
    records:
      train_en: /workspace/data/datasets/emilia2_short/versions/short-20261014/records/train_en.jsonl.gz
      train_zh: /workspace/data/datasets/emilia2_short/versions/short-20261014/records/train_zh.jsonl.gz
    audio_index: [/workspace/data/datasets/emilia2_short/versions/short-20261014/audio_index/audio-index.jsonl.gz]
    audio: primary
    audio_records: emilia2_short@short-lance-20261023   # short 的 m4a 已不在盘上，音频核对按这个版本的记录读 Lance 里的同一段
    exclude_records: [/workspace/data/datasets/ts_asr_real/source/v2-20261013/excluded-records-emilia2_short-train_en.txt, /workspace/data/datasets/ts_asr_real/source/v2-20261013/excluded-records-emilia2_short-train_zh.txt]
    # 同样的记录 ID 和文本，音频改读 Lance；没有音频索引
    also_derive:
    - dataset: emilia2_short@short-lance-20261023
      records:
        train_en: /workspace/data/datasets/emilia2_short/versions/short-lance-20261023/records/train_en.jsonl.gz
        train_zh: /workspace/data/datasets/emilia2_short/versions/short-lance-20261023/records/train_zh.jsonl.gz
  emilia2_dialog:
    kind: records
    dataset: emilia2_dialog@dialog-turn-taking-20261013-enroll
    records:
      train_2spk: /workspace/data/datasets/emilia2_dialog/versions/dialog-turn-taking-20261013-enroll/records/train_2spk.jsonl.gz
      train_3spk: /workspace/data/datasets/emilia2_dialog/versions/dialog-turn-taking-20261013-enroll/records/train_3spk.jsonl.gz
      train_neg: /workspace/data/datasets/emilia2_dialog/versions/dialog-turn-taking-20261013-enroll/records/train_neg.jsonl.gz
    audio_index: [/workspace/data/datasets/emilia2_dialog/versions/dialog-turn-taking-20261013-enroll/audio_index/audio-index-flac.jsonl.gz]
    audio: mixture
    exclude_records: [/workspace/data/datasets/ts_asr_real/source/v2-20261013/excluded-records-emilia2_dialog-train_2spk.txt, /workspace/data/datasets/ts_asr_real/source/v2-20261013/excluded-records-emilia2_dialog-train_3spk.txt, /workspace/data/datasets/ts_asr_real/source/v2-20261013/excluded-records-emilia2_dialog-train_neg.txt]
  emilia2_mix:
    kind: records
    dataset: emilia2_mix@mix-20261013
    records:
      train_2spk: /workspace/data/datasets/emilia2-mix/versions/mix-20261013/records/train_2spk.jsonl.gz
      train_3spk: /workspace/data/datasets/emilia2-mix/versions/mix-20261013/records/train_3spk.jsonl.gz
      train_neg: /workspace/data/datasets/emilia2-mix/versions/mix-20261013/records/train_neg.jsonl.gz
    audio_index: [/workspace/data/datasets/emilia2-mix/versions/mix-20261013/audio_index/audio-index-flac.jsonl.gz]
    audio: mix_protocol
    mix_protocol: /workspace/data/datasets/emilia2-mix/versions/mix-20261013/supervision/protocol-*.jsonl.gz
    exclude_records: [/workspace/data/datasets/ts_asr_real/source/v2-20261013/excluded-records-emilia2_mix-train_2spk.txt, /workspace/data/datasets/ts_asr_real/source/v2-20261013/excluded-records-emilia2_mix-train_3spk.txt, /workspace/data/datasets/ts_asr_real/source/v2-20261013/excluded-records-emilia2_mix-train_neg.txt]
  # 会议（人工标注）：asr 与 turn-taking 两种版本文本不同，各自判定。
  # audio_check: false：人工标注比 Qwen3-ASR 准，远场、电话和多人混合音频上 ASR 判不了（试跑 4 个音频不符全是 ASR 听错），不做音频核对
  magicdata_ramc_asr:
    kind: records
    dataset: magicdata_ramc@asr-20261014
    records:
      train: /workspace/data/datasets/magicdata_ramc/versions/asr-20261014/records/train.jsonl.gz
    audio_index: [/workspace/data/datasets/magicdata_ramc/versions/asr-20261014/audio_index/audio-index.jsonl.gz]
    audio: primary
    audio_check: false
  aishell4_asr:
    kind: records
    dataset: aishell4@asr-20261014
    records:
      train: /workspace/data/datasets/aishell4/versions/asr-20261014/records/train.jsonl.gz
    audio_index: [/workspace/data/datasets/aishell4/versions/asr-20261014/audio_index/audio-index.jsonl.gz]
    audio: primary
    audio_check: false
  alimeeting_sdm_asr:
    kind: records
    dataset: alimeeting_sdm@asr-20261014
    records:
      train: /workspace/data/datasets/alimeeting_sdm/versions/asr-20261014/records/train.jsonl.gz
    audio_index: [/workspace/data/datasets/alimeeting_sdm/versions/asr-20261014/audio_index/audio-index.jsonl.gz]
    audio: primary
    audio_check: false
  magicdata_ramc_tt:
    kind: records
    dataset: magicdata_ramc@turn-taking-20261014
    records:
      train_2spk: /workspace/data/datasets/magicdata_ramc/versions/turn-taking-20261014/records/train_2spk.jsonl.gz
      train_neg: /workspace/data/datasets/magicdata_ramc/versions/turn-taking-20261014/records/train_neg.jsonl.gz
    audio_index: [/workspace/data/datasets/magicdata_ramc/versions/turn-taking-20261014/audio_index/audio-index.jsonl.gz]
    audio: mixture
    audio_check: false
  aishell4_tt:
    kind: records
    dataset: aishell4@turn-taking-20261014
    records:
      train_2spk: /workspace/data/datasets/aishell4/versions/turn-taking-20261014/records/train_2spk.jsonl.gz
      train_3spk: /workspace/data/datasets/aishell4/versions/turn-taking-20261014/records/train_3spk.jsonl.gz
      train_neg: /workspace/data/datasets/aishell4/versions/turn-taking-20261014/records/train_neg.jsonl.gz
    audio_index: [/workspace/data/datasets/aishell4/versions/turn-taking-20261014/audio_index/audio-index.jsonl.gz]
    audio: mixture
    audio_check: false
  alimeeting_sdm_tt:
    kind: records
    dataset: alimeeting_sdm@turn-taking-20261014
    records:
      train_2spk: /workspace/data/datasets/alimeeting_sdm/versions/turn-taking-20261014/records/train_2spk.jsonl.gz
      train_3spk: /workspace/data/datasets/alimeeting_sdm/versions/turn-taking-20261014/records/train_3spk.jsonl.gz
      train_neg: /workspace/data/datasets/alimeeting_sdm/versions/turn-taking-20261014/records/train_neg.jsonl.gz
    audio_index: [/workspace/data/datasets/alimeeting_sdm/versions/turn-taking-20261014/audio_index/audio-index.jsonl.gz]
    audio: mixture
    audio_check: false
  vitw:
    kind: lhotse
    dataset: vitw@2m-20261013
    split: train
    language: zh   # 中英混合，只扫中文
    audio_check: false   # 音频是加了回声、噪声、丢帧的，Qwen3-ASR 识别不出（试跑 7 个音频不符约 6 个是 ASR 听错）；标注来自干净原音
    supervisions: /workspace/data/datasets/vitw/versions/2m-20261013/train_supervisions/vitw_2m_supervisions_train.jsonl.gz
    recordings: /workspace/data/datasets/vitw/versions/2m-20261013/train_recordings/vitw_2m_recordings_train.jsonl.gz
