# 跨语言注册的目标说话人 ASR 评测集（ts_asr_crosslingual）：混合段为西班牙语。
# 每个场景出两份：注册取同一说话人同语言的另一句（-same，对照）或另一种语言的一句（-cross），两份共用 pair，场景逐条相同、只换注册。
# 西语只有真人部分：Common Voice es dev/test 与 en 同一账号的说话人（es 与 zh 同一账号的没有，所以跨语言注册只有英文）。
# 西语语句只取 dev/test（训练用 common_voice_es@es-train-v1-20261108 的 train，CV 各划分说话人不重叠，导出时再核对一遍）；
# 英文注册语句与中英版本一样取 en 全部划分，去掉作为 TS 训练目标出现过的人（中英及西语 TS 场景池的目标）。
# 同一账号可能是几个人共用：qc_bilingual_identity.py 只留与西语语句同一人声的语句（39 人里去掉 4 人）。
version: es-v1-20261111
enroll_store_seconds: 10
dataset_id: ts_asr_crosslingual
language: es
description: 跨语言注册 TS-ASR 评测集（混合段西班牙语）：Common Voice 同一账号既录西语（dev/test）又录英文、从未作为 TS 训练目标、两种语言都核对过是同一人声（ECAPA，每种语言至少 5 句）的 35 人；每个场景配同语言（西语）与跨语言（英文）两种注册。没有合成音色部分（Common Voice 里没有同时录西语和中文的说话人）。只用于评测，不进训练。配方见 scripts/ts_benchmark/recipe-crosslingual-es.yaml。
seed: 20261109
sample_rate: 16000

pools:
  cv_es:
    description: Common Voice 双语目标说话人的西语语句（只取 dev/test）
    sources:
      - {dataset: cv_bilingual, version: es-v1-20261111, split: cv-bilingual-es, manifest: {alias: aidc_data, path: datasets/ts_asr_crosslingual/source/pools/es-v1-20261111/cv-bilingual-es-verified/utterances.jsonl.gz}}
  cv_en:
    description: 同一批目标说话人的英文语句（跨语言注册用）
    sources:
      - {dataset: cv_bilingual, version: es-v1-20261111, split: cv-bilingual-en, manifest: {alias: aidc_data, path: datasets/ts_asr_crosslingual/source/pools/es-v1-20261111/cv-bilingual-en-verified/utterances.jsonl.gz}}
  cvi_es:
    description: Common Voice 西语 dev/test 的其他说话人（干扰人，已去掉双语目标）
    sources:
      - {dataset: common_voice_es, version: legacy, split: cv-interferer-es, manifest: {alias: aidc_data, path: datasets/ts_asr_crosslingual/source/pools/es-v1-20261111/cv-interferer-es/utterances.jsonl.gz}}
utterance_seconds: [1.5, 12.0]
short_utterance_seconds: [0.5, 1.6]
min_utterances_per_speaker: 2  # 干扰人只有 2–3 句 test 语句；目标在导出时已要求每种语言至少 5 句

noise:
  musan_noise: {dataset: musan, version: legacy-20260804, split: noise}
  musan_music: {dataset: musan, version: legacy-20260804, split: music}
  traffic: {dataset: audioset_road_traffic, version: legacy-20260804, split: all}
rir:
  archive: /workspace/data/DATA-TTS/dns5/datasets_fullband.impulse_responses_000.tar.bz2
  count: 300

default_n: 120
noise_floor:
  dbfs: [-65, -35]
  kinds: {white: 0.15, pink: 0.15, real: 0.70}
  real_pools: [wham, dns5_audioset, dns5_freesound]

splits:
  - {group: cv-solo, name: cv-solo-same, kind: pos, schedule: full, k: 0, duration: [4, 12], target_pool: cv_es, interferer_pool: cvi_es, enroll_pool: cv_es, pair: cv-solo, n: 120}
  - {group: cv-solo, name: cv-solo-cross, kind: pos, schedule: full, k: 0, duration: [4, 12], target_pool: cv_es, interferer_pool: cvi_es, enroll_pool: cv_en, pair: cv-solo, n: 120}
  - {group: cv-k1, name: cv-k1-same, kind: pos, schedule: full, k: 1, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_es, interferer_pool: cvi_es, enroll_pool: cv_es, pair: cv-k1, n: 120}
  - {group: cv-k1, name: cv-k1-cross, kind: pos, schedule: full, k: 1, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_es, interferer_pool: cvi_es, enroll_pool: cv_en, pair: cv-k1, n: 120}
  - {group: cv-k2, name: cv-k2-same, kind: pos, schedule: full, k: 2, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_es, interferer_pool: cvi_es, enroll_pool: cv_es, pair: cv-k2, n: 120}
  - {group: cv-k2, name: cv-k2-cross, kind: pos, schedule: full, k: 2, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_es, interferer_pool: cvi_es, enroll_pool: cv_en, pair: cv-k2, n: 120}
  - {group: cv-abs1, name: cv-abs1-same, kind: neg, k: 1, duration: [6, 15], target_pool: cv_es, interferer_pool: cvi_es, enroll_pool: cv_es, pair: cv-abs1, n: 120}
  - {group: cv-abs1, name: cv-abs1-cross, kind: neg, k: 1, duration: [6, 15], target_pool: cv_es, interferer_pool: cvi_es, enroll_pool: cv_en, pair: cv-abs1, n: 120}
  - {group: cv-abs2, name: cv-abs2-same, kind: neg, k: 2, duration: [6, 15], target_pool: cv_es, interferer_pool: cvi_es, enroll_pool: cv_es, pair: cv-abs2, n: 120}
  - {group: cv-abs2, name: cv-abs2-cross, kind: neg, k: 2, duration: [6, 15], target_pool: cv_es, interferer_pool: cvi_es, enroll_pool: cv_en, pair: cv-abs2, n: 120}
