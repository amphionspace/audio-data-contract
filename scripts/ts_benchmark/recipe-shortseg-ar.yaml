# 阿拉伯语版：与葡语版（recipe-shortseg-pt.yaml）、西语版、英文版同一场景、随机种子与噪声，说话人换成 Common Voice 24.0 ar dev+test。
# 目标说话人评测集的短片段补充（ts_asr_shortseg）：业务第三批反馈（business_feedback@ts-20261016）里
# 28 条错误中有 17 条是 1.2–6 秒、注册人没说话、别人在说话的片段（持续收音时 VAD 切出的长度），
# 而 ts_asr_benchmark 的缺席场景只有 0.4–1.2 秒（abs-short）和 6–18 秒两档。这里补上中间的长度。
# 干扰人从片段开头附近开始说话（VAD 切出的片段以语音开头）；底噪与 v3 相同。
version: ar-v1-20261127
enroll_store_seconds: 10
dataset_id: ts_asr_shortseg
language: ar
description: 阿拉伯语目标说话人 ASR 评测集（ts_asr_shortseg）：与葡语版 pt-v1-20261117、西语版 es-v1-20261111、英文版 en-v1-20261031 同一配方与随机种子，说话人换成 Common Voice 24.0 ar dev+test（众包朗读，句子以标准阿拉伯语为主，各自设备）；含英文版的对照 solo-mid（西语版没有）；不含业务真实注册录音条件。只用于评测，不进训练。场景见 scripts/ts_benchmark/recipe-shortseg-ar.yaml。
seed: 20261017
sample_rate: 16000

# 说话人来自训练没有用过的划分：Common Voice 24.0 ar dev + test（common_voice_ar@ar-eval-v1-20261127；说话人与 CV 24.0 train 零重叠，
# dev 与 test 不重叠；阿拉伯语训练版本须去掉这些说话人和句子，见 catalog/ar_eval_v1.yaml）。dev 只有 64 人，与 test 合起来至少 6 句的有 448 人。
pools:
  read:
    description: Common Voice 24.0 ar dev + test，众包朗读，至少 6 句 1.5–9 秒的说话人
    sources:
      - {dataset: common_voice_ar, version: ar-eval-v1-20261127, split: dev}
      - {dataset: common_voice_ar, version: ar-eval-v1-20261127, split: test}
  mixed:
    description: 与 read 相同（只有一个池）
    union: [read]
utterance_seconds: [1.5, 9.0]
short_utterance_seconds: [0.5, 1.6]
min_utterances_per_speaker: 6

noise:
  musan_noise: {dataset: musan, version: legacy-20260804, split: noise}
rir:
  archive: /workspace/data/DATA-TTS/dns5/datasets_fullband.impulse_responses_000.tar.bz2
  count: 300

default_n: 120

noise_floor:
  dbfs: [-65, -35]
  kinds: {white: 0.15, pink: 0.15, real: 0.70}
  real_pools: [wham, dns5_audioset, dns5_freesound]

splits:
  # 注册人缺席，1.2–3 秒与 3–6 秒，1 或 2 个干扰人；期望输出为空。
  - {group: shortseg, name: abs-mid1-k1, kind: neg, k: 1, duration: [1.2, 3.0], interferer_start: [0.0, 0.3]}
  - {group: shortseg, name: abs-mid1-k2, kind: neg, k: 2, duration: [1.2, 3.0], interferer_start: [0.0, 0.3]}
  - {group: shortseg, name: abs-mid2-k1, kind: neg, k: 1, duration: [3.0, 6.0], interferer_start: [0.0, 0.3]}
  - {group: shortseg, name: abs-mid2-k2, kind: neg, k: 2, duration: [3.0, 6.0], interferer_start: [0.0, 0.3]}
  # 对照：目标单独说一句短话（2–6 秒），检查压低误输出时没有漏掉注册人的短句。西语版没有这一列（CV es dev 句子太长）；
  # CV ar dev+test 够条件说话人的句子里有 6,539 句不长于 3.6 秒（397 人），与英文版、葡语版相同地建。
  - {group: shortseg, name: solo-mid, kind: pos, schedule: full, k: 0, duration: [2.0, 6.0]}
