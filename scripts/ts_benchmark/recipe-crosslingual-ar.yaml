# 跨语言注册的目标说话人 ASR 评测集（ts_asr_crosslingual）：混合段为阿拉伯语，配方与西语版、葡语版（recipe-crosslingual-pt.yaml）相同。
# 每个场景出两份：注册取同一说话人同语言的另一句（-same，对照）或另一种语言的一句（-cross），两份共用 pair，场景逐条相同、只换注册。
# 阿拉伯语只有真人部分：Common Voice 24.0 ar dev/test 与 en 同一账号的说话人（跨语言注册只有英文，与西语、葡语相同）。
# 阿拉伯语语句只取 dev/test（common_voice_ar@ar-eval-v1-20261127；CV 24.0 train 是训练集，导出时核对目标不在其中）；
# 英文注册语句与中英、西语、葡语版本一样取 en 全部划分，去掉作为 TS 训练目标出现过的人（与西语、葡语版同一份名单 ts-training-targets.json；阿拉伯语没有 TS 训练数据）。
# 同一账号可能是几个人共用：qc_bilingual_identity.py 只留与阿拉伯语语句同一人声的语句（59 个双语账号去掉 21 个 TS 训练目标剩 38 人，核对再去掉 6 人）。
version: ar-v1-20261127
enroll_store_seconds: 10
dataset_id: ts_asr_crosslingual
language: ar
description: 跨语言注册 TS-ASR 评测集（混合段阿拉伯语）：Common Voice 同一账号既录阿拉伯语（24.0 dev/test）又录英文、从未作为 TS 训练目标、两种语言都核对过是同一人声（ECAPA，每种语言至少 5 句）的 32 人；每个场景配同语言（阿拉伯语）与跨语言（英文）两种注册。没有合成音色部分（Common Voice 里没有同时录阿拉伯语和中文的说话人）。与西语版 es-v1-20261111、葡语版 pt-v1-20261117 同一配方与随机种子。只用于评测，不进训练。配方见 scripts/ts_benchmark/recipe-crosslingual-ar.yaml。
seed: 20261109
sample_rate: 16000

pools:
  cv_ar:
    description: Common Voice 双语目标说话人的阿拉伯语语句（只取 24.0 dev/test）
    sources:
      - {dataset: cv_bilingual, version: ar-v1-20261127, split: cv-bilingual-ar, manifest: {alias: aidc_data, path: datasets/ts_asr_crosslingual/source/pools/ar-v1-20261127/cv-bilingual-ar-verified/utterances.jsonl.gz}}
  cv_en:
    description: 同一批目标说话人的英文语句（跨语言注册用）
    sources:
      - {dataset: cv_bilingual, version: ar-v1-20261127, split: cv-bilingual-en, manifest: {alias: aidc_data, path: datasets/ts_asr_crosslingual/source/pools/ar-v1-20261127/cv-bilingual-en-verified/utterances.jsonl.gz}}
  cvi_ar:
    description: Common Voice 阿拉伯语 24.0 dev/test 的其他说话人（干扰人，已去掉双语目标）
    sources:
      - {dataset: common_voice_ar, version: ar-eval-v1-20261127, split: cv-interferer-ar, manifest: {alias: aidc_data, path: datasets/ts_asr_crosslingual/source/pools/ar-v1-20261127/cv-interferer-ar/utterances.jsonl.gz}}
utterance_seconds: [1.5, 12.0]
short_utterance_seconds: [0.5, 1.6]
min_utterances_per_speaker: 2  # 干扰人只有 2–3 句 test 语句；目标在导出时已要求每种语言至少 5 句

noise:
  musan_noise: {dataset: musan, version: legacy-20260804, split: noise}
  musan_music: {dataset: musan, version: legacy-20260804, split: music}
  traffic: {dataset: audioset_road_traffic, version: legacy-20260804, split: all}
rir:
  archive: /workspace/data/DATA-TTS/dns5/datasets_fullband.impulse_responses_000.tar.bz2
  count: 300

default_n: 120
noise_floor:
  dbfs: [-65, -35]
  kinds: {white: 0.15, pink: 0.15, real: 0.70}
  real_pools: [wham, dns5_audioset, dns5_freesound]

splits:
  - {group: cv-solo, name: cv-solo-same, kind: pos, schedule: full, k: 0, duration: [4, 12], target_pool: cv_ar, interferer_pool: cvi_ar, enroll_pool: cv_ar, pair: cv-solo, n: 120}
  - {group: cv-solo, name: cv-solo-cross, kind: pos, schedule: full, k: 0, duration: [4, 12], target_pool: cv_ar, interferer_pool: cvi_ar, enroll_pool: cv_en, pair: cv-solo, n: 120}
  - {group: cv-k1, name: cv-k1-same, kind: pos, schedule: full, k: 1, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_ar, interferer_pool: cvi_ar, enroll_pool: cv_ar, pair: cv-k1, n: 120}
  - {group: cv-k1, name: cv-k1-cross, kind: pos, schedule: full, k: 1, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_ar, interferer_pool: cvi_ar, enroll_pool: cv_en, pair: cv-k1, n: 120}
  - {group: cv-k2, name: cv-k2-same, kind: pos, schedule: full, k: 2, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_ar, interferer_pool: cvi_ar, enroll_pool: cv_ar, pair: cv-k2, n: 120}
  - {group: cv-k2, name: cv-k2-cross, kind: pos, schedule: full, k: 2, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_ar, interferer_pool: cvi_ar, enroll_pool: cv_en, pair: cv-k2, n: 120}
  - {group: cv-abs1, name: cv-abs1-same, kind: neg, k: 1, duration: [6, 15], target_pool: cv_ar, interferer_pool: cvi_ar, enroll_pool: cv_ar, pair: cv-abs1, n: 120}
  - {group: cv-abs1, name: cv-abs1-cross, kind: neg, k: 1, duration: [6, 15], target_pool: cv_ar, interferer_pool: cvi_ar, enroll_pool: cv_en, pair: cv-abs1, n: 120}
  - {group: cv-abs2, name: cv-abs2-same, kind: neg, k: 2, duration: [6, 15], target_pool: cv_ar, interferer_pool: cvi_ar, enroll_pool: cv_ar, pair: cv-abs2, n: 120}
  - {group: cv-abs2, name: cv-abs2-cross, kind: neg, k: 2, duration: [6, 15], target_pool: cv_ar, interferer_pool: cvi_ar, enroll_pool: cv_en, pair: cv-abs2, n: 120}
