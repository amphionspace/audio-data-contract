# 跨语言注册的目标说话人 ASR 评测集（ts_asr_crosslingual）：混合段为葡萄牙语，配方与西语版（recipe-crosslingual-es.yaml）相同。
# 每个场景出两份：注册取同一说话人同语言的另一句（-same，对照）或另一种语言的一句（-cross），两份共用 pair，场景逐条相同、只换注册。
# 葡语只有真人部分：Common Voice 27.0 pt dev/test 与 en 同一账号的说话人（pt 与 zh 同一账号的没有，所以跨语言注册只有英文）。
# 葡语语句只取 dev/test（common_voice_pt@pt-eval-v1-20261117；训练用 common_voice_pt@pt-train-v1-20261117，导出时核对目标不在其中）；
# 英文注册语句与中英、西语版本一样取 en 全部划分，去掉作为 TS 训练目标出现过的人（与西语版同一份名单 ts-training-targets.json；葡语没有 TS 训练数据）。
# 同一账号可能是几个人共用：qc_bilingual_identity.py 只留与葡语语句同一人声的语句（52 人里去掉 8 人）。
version: pt-v1-20261117
enroll_store_seconds: 10
dataset_id: ts_asr_crosslingual
language: pt
description: 跨语言注册 TS-ASR 评测集（混合段葡萄牙语）：Common Voice 同一账号既录葡语（27.0 dev/test）又录英文、从未作为 TS 训练目标、两种语言都核对过是同一人声（ECAPA，每种语言至少 5 句）的 44 人；每个场景配同语言（葡语）与跨语言（英文）两种注册。没有合成音色部分（Common Voice 里没有同时录葡语和中文的说话人）。与西语版 es-v1-20261111 同一配方与随机种子。只用于评测，不进训练。配方见 scripts/ts_benchmark/recipe-crosslingual-pt.yaml。
seed: 20261109
sample_rate: 16000

pools:
  cv_pt:
    description: Common Voice 双语目标说话人的葡语语句（只取 27.0 dev/test）
    sources:
      - {dataset: cv_bilingual, version: pt-v1-20261117, split: cv-bilingual-pt, manifest: {alias: aidc_data, path: datasets/ts_asr_crosslingual/source/pools/pt-v1-20261117/cv-bilingual-pt-verified/utterances.jsonl.gz}}
  cv_en:
    description: 同一批目标说话人的英文语句（跨语言注册用）
    sources:
      - {dataset: cv_bilingual, version: pt-v1-20261117, split: cv-bilingual-en, manifest: {alias: aidc_data, path: datasets/ts_asr_crosslingual/source/pools/pt-v1-20261117/cv-bilingual-en-verified/utterances.jsonl.gz}}
  cvi_pt:
    description: Common Voice 葡语 27.0 dev/test 的其他说话人（干扰人，已去掉双语目标）
    sources:
      - {dataset: common_voice_pt, version: pt-eval-v1-20261117, split: cv-interferer-pt, manifest: {alias: aidc_data, path: datasets/ts_asr_crosslingual/source/pools/pt-v1-20261117/cv-interferer-pt/utterances.jsonl.gz}}
utterance_seconds: [1.5, 12.0]
short_utterance_seconds: [0.5, 1.6]
min_utterances_per_speaker: 2  # 干扰人只有 2–3 句 test 语句；目标在导出时已要求每种语言至少 5 句

noise:
  musan_noise: {dataset: musan, version: legacy-20260804, split: noise}
  musan_music: {dataset: musan, version: legacy-20260804, split: music}
  traffic: {dataset: audioset_road_traffic, version: legacy-20260804, split: all}
rir:
  archive: /workspace/data/DATA-TTS/dns5/datasets_fullband.impulse_responses_000.tar.bz2
  count: 300

default_n: 120
noise_floor:
  dbfs: [-65, -35]
  kinds: {white: 0.15, pink: 0.15, real: 0.70}
  real_pools: [wham, dns5_audioset, dns5_freesound]

splits:
  - {group: cv-solo, name: cv-solo-same, kind: pos, schedule: full, k: 0, duration: [4, 12], target_pool: cv_pt, interferer_pool: cvi_pt, enroll_pool: cv_pt, pair: cv-solo, n: 120}
  - {group: cv-solo, name: cv-solo-cross, kind: pos, schedule: full, k: 0, duration: [4, 12], target_pool: cv_pt, interferer_pool: cvi_pt, enroll_pool: cv_en, pair: cv-solo, n: 120}
  - {group: cv-k1, name: cv-k1-same, kind: pos, schedule: full, k: 1, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_pt, interferer_pool: cvi_pt, enroll_pool: cv_pt, pair: cv-k1, n: 120}
  - {group: cv-k1, name: cv-k1-cross, kind: pos, schedule: full, k: 1, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_pt, interferer_pool: cvi_pt, enroll_pool: cv_en, pair: cv-k1, n: 120}
  - {group: cv-k2, name: cv-k2-same, kind: pos, schedule: full, k: 2, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_pt, interferer_pool: cvi_pt, enroll_pool: cv_pt, pair: cv-k2, n: 120}
  - {group: cv-k2, name: cv-k2-cross, kind: pos, schedule: full, k: 2, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_pt, interferer_pool: cvi_pt, enroll_pool: cv_en, pair: cv-k2, n: 120}
  - {group: cv-abs1, name: cv-abs1-same, kind: neg, k: 1, duration: [6, 15], target_pool: cv_pt, interferer_pool: cvi_pt, enroll_pool: cv_pt, pair: cv-abs1, n: 120}
  - {group: cv-abs1, name: cv-abs1-cross, kind: neg, k: 1, duration: [6, 15], target_pool: cv_pt, interferer_pool: cvi_pt, enroll_pool: cv_en, pair: cv-abs1, n: 120}
  - {group: cv-abs2, name: cv-abs2-same, kind: neg, k: 2, duration: [6, 15], target_pool: cv_pt, interferer_pool: cvi_pt, enroll_pool: cv_pt, pair: cv-abs2, n: 120}
  - {group: cv-abs2, name: cv-abs2-cross, kind: neg, k: 2, duration: [6, 15], target_pool: cv_pt, interferer_pool: cvi_pt, enroll_pool: cv_en, pair: cv-abs2, n: 120}
