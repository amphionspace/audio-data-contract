# 目标说话人评测集的「另一个人说一句极短的话」补充（ts_asr_nearshort）：业务第五批反馈（business_feedback@ts-20261021，
# 飞书表格第 40、41 行，换了一段新的注册录音 realreg4）。两条都是注册人没说话、另一个人说了一句约 1 秒的话
# （「哎，又来了」0.7 秒、「现在就没了」1.1 秒），VAD 切出的片段 1.5 / 2.8 秒，模型输出了这句话。
# 已有场景覆盖不到：abs-short 把干扰人的句子截成 0.4–1.2 秒的半句；abs-mid1 是 1.2–3 秒内连续说话；abs-hard/abs-hard-k1
# 声音相近但是 6–18 秒长片段。这里每个片段只有一句完整的短话（0.5–1.6 秒的整句），声音相近与随机两列配对。
# 探针（2026-10-21，AISHELL-3，ERes2NetV2 最近 3 人）：10.21 版本在相近声音短句上误输出 24%，随机声音短句 0%，相近声音长句 8%。
# v2-20261022：v1 的 5 列逐条不变，加注册人说一句短话时目标声音弱、远场、有噪声和有人同时说短话的在场列（与 solo-short-pos 同一批场景），
# 用来量出「短片段更倾向不出字」的漏识代价——v1 的在场对照只有干净的单人短句。
version: en-v1-20261031
enroll_store_seconds: 10
dataset_id: ts_asr_nearshort
language: en
description: 英文目标说话人 ASR 评测集（ts_asr_nearshort）：与中文版同一配方与随机种子，说话人换成 VCTK、CS-Dialogue 英文 test、LibriSpeech test-clean/test-other；不含业务真实注册录音条件。只用于评测，不进训练。场景见 scripts/ts_benchmark/recipe-nearshort-en.yaml。
seed: 20261021
sample_rate: 16000

# 说话人来自训练没有用过的英文语料：LibriSpeech、CS-Dialogue 取官方 test 划分；VCTK 训练从未使用（无官方划分）。
pools:
  studio:
    description: VCTK 棚内录音（mic1），109 位说话人、多种英语口音，每人取 80 句（export_tts_pool.py 导出）
    sources:
      - {dataset: vctk, version: tts-unified-v0.1, split: train, manifest: {alias: aidc_data, path: datasets/ts_asr_benchmark/source/pools/vctk-tts-unified-v0.1-mic1/utterances.jsonl.gz}}
  phone:
    description: CS-Dialogue 英文 test，中国说话人用英语自由对话、各自设备录音（有口音），27 位可用说话人
    sources:
      - {dataset: cs_dialogue_en, version: legacy-20260804, split: test, skip_text: "<NPS/>|\\*\\*"}  # <NPS/>（旁人说话）和 **（听不清）的句子不用；其余标签（<FIL/> 等）去掉
  read:
    description: LibriSpeech test-clean 与 test-other，有声书朗读，73 位说话人
    sources:
      - {dataset: librispeech, version: legacy-20260804, split: test_clean}
      - {dataset: librispeech, version: legacy-20260804, split: test_other}
  mixed:
    description: 上面三个池的并集
    union: [studio, phone, read]
utterance_seconds: [1.5, 9.0]
short_utterance_seconds: [0.5, 1.6]
min_utterances_per_speaker: 6

noise:
  musan_noise: {dataset: musan, version: legacy-20260804, split: noise}
  babble_en: {alias: open_noise, glob: "babble_synth/en/test/*.flac"}  # 同 ts_asr_noise
rir:
  archive: /workspace/data/DATA-TTS/dns5/datasets_fullband.impulse_responses_000.tar.bz2
  count: 300

default_n: 300

noise_floor:
  dbfs: [-65, -35]
  kinds: {white: 0.15, pink: 0.15, real: 0.70}
  real_pools: [wham, dns5_audioset, dns5_freesound]

# 第五批测试人员的注册录音（与第 40、41 行同一段，3 秒）。

splits:
  # ---- 注册人缺席、片段里只有另一个人说一句完整的短话（1.5–3 秒片段，从 0.1–0.6 秒开始） ----
  # 两列共用同一批混合音频，只换注册人：short-rand-neg 是随机的另一个人，short-hard-neg 是与干扰人声音最近的 5 个人之一（同 abs-hard）。
  - {group: nearshort, name: short-rand-neg, kind: neg, k: 1, duration: [1.5, 3.0], interferer_utts: single_short, interferer_start: [0.1, 0.6], pair: short1}
  - {group: nearshort, name: short-hard-neg, kind: neg, k: 1, duration: [1.5, 3.0], interferer_utts: single_short, interferer_start: [0.1, 0.6], hard: true, pair: short1}
  # ---- 对照：注册人自己说一句短话（同样的片段长度），检查压低误输出时没有漏掉注册人的短句 ----
  - {group: nearshort, name: solo-short-pos, kind: pos, schedule: short, k: 0, duration: [1.5, 3.0]}
  # ---- v2：注册人说一句短话，目标声音弱、远场、有噪声（与 solo-short-pos 同一个 pair：同一批短句、同样的时间安排，只改一个因素） ----
  - {group: nearshort, name: solo-short-q20-pos, kind: pos, schedule: short, k: 0, duration: [1.5, 3.0], mix_gain_db: -20, pair: solo-short-pos}
  - {group: nearshort, name: solo-short-wham40-pos, kind: pos, schedule: short, k: 0, duration: [1.5, 3.0], noise_floor: {dbfs: [-40, -40], kinds: [wham]}, pair: solo-short-pos}
  - {group: nearshort, name: solo-short-wham30-pos, kind: pos, schedule: short, k: 0, duration: [1.5, 3.0], noise_floor: {dbfs: [-30, -30], kinds: [wham]}, pair: solo-short-pos}
  - {group: nearshort, name: solo-short-babble10-pos, kind: pos, schedule: short, k: 0, duration: [1.5, 3.0], noise: {kind: babble_en, snr_db: [10, 10]}, pair: solo-short-pos}
  # 远场：混合过 SLR28 实测房间响应、注册是近场（far）；注册和混合都远场（farfar）。
  - {group: nearshort, name: solo-short-far-pos, kind: pos, schedule: short, k: 0, duration: [1.5, 3.0], rir: {target: real}, pair: solo-short-pos}
  - {group: nearshort, name: solo-short-farfar-pos, kind: pos, schedule: short, k: 0, duration: [1.5, 3.0], rir: {target: real}, enroll: reverb, enroll_rir_pool: real, pair: solo-short-pos}
  # 注册人说一句短话，另一个随机的人也说一句短话（同一个 1.5–3 秒片段）。
  - {group: nearshort, name: short-k1-pos, kind: pos, schedule: short, k: 1, duration: [1.5, 3.0], interferer_utts: single_short, interferer_start: [0.1, 0.6]}
