# 跨语言注册的目标说话人 ASR 评测集（ts_asr_crosslingual）：混合段为英文。
# 每个场景出两份：注册取同一说话人同语言的另一句（-same，对照）或另一种语言的一句（-cross），两份共用 pair，场景逐条相同、只换注册。
version: en-v1-20261109
enroll_store_seconds: 10
dataset_id: ts_asr_crosslingual
language: en
description: 跨语言注册 TS-ASR 评测集（混合段英文）：Common Voice 同一账号既录中文又录英文、从未作为 TS 训练目标的 78 人，以及 Qwen3-TTS-12Hz-1.7B-Base 跨语言克隆的 50 个合成音色（注册与混合段都是合成音）；每个场景配同语言与跨语言两种注册。只用于评测，不进训练。配方见 scripts/ts_benchmark/recipe-crosslingual-en.yaml。
seed: 20261109
sample_rate: 16000

pools:
  cv_en:
    description: Common Voice 双语目标说话人的英文语句
    sources:
      - {dataset: cv_bilingual, version: v1-20261109, split: cv-bilingual-en, manifest: {alias: aidc_data, path: datasets/ts_asr_crosslingual/source/pools/cv-bilingual-en/utterances.jsonl.gz}}
  cv_zh:
    description: 同一批目标说话人的另一种语言语句（跨语言注册用）
    sources:
      - {dataset: cv_bilingual, version: v1-20261109, split: cv-bilingual-zh, manifest: {alias: aidc_data, path: datasets/ts_asr_crosslingual/source/pools/cv-bilingual-zh/utterances.jsonl.gz}}
  cvi_en:
    description: Common Voice 英文 test 的其他说话人（干扰人，已去掉双语目标）
    sources:
      - {dataset: common_voice_en, version: v1-20261109, split: cv-interferer-en, manifest: {alias: aidc_data, path: datasets/ts_asr_crosslingual/source/pools/cv-interferer-en/utterances.jsonl.gz}}
  tts_en:
    description: Qwen3-TTS 合成音色的英文语句（目标与干扰人）
    sources:
      - {dataset: tts_bilingual, version: v1-20261109, split: tts-bilingual-en, manifest: {alias: aidc_data, path: datasets/ts_asr_crosslingual/source/pools/tts-bilingual-en/utterances.jsonl.gz}}
  tts_zh:
    description: 同一批合成音色的另一种语言语句（跨语言注册用）
    sources:
      - {dataset: tts_bilingual, version: v1-20261109, split: tts-bilingual-zh, manifest: {alias: aidc_data, path: datasets/ts_asr_crosslingual/source/pools/tts-bilingual-zh/utterances.jsonl.gz}}
utterance_seconds: [1.5, 12.0]
short_utterance_seconds: [0.5, 1.6]
min_utterances_per_speaker: 2  # 干扰人只有 2–3 句 test 语句；目标在导出时已要求每种语言至少 5 句

noise:
  musan_noise: {dataset: musan, version: legacy-20260804, split: noise}
  musan_music: {dataset: musan, version: legacy-20260804, split: music}
  traffic: {dataset: audioset_road_traffic, version: legacy-20260804, split: all}
rir:
  archive: /workspace/data/DATA-TTS/dns5/datasets_fullband.impulse_responses_000.tar.bz2
  count: 300

default_n: 120
noise_floor:
  dbfs: [-65, -35]
  kinds: {white: 0.15, pink: 0.15, real: 0.70}
  real_pools: [wham, dns5_audioset, dns5_freesound]

splits:
  - {group: cv-solo, name: cv-solo-same, kind: pos, schedule: full, k: 0, duration: [4, 12], target_pool: cv_en, interferer_pool: cvi_en, enroll_pool: cv_en, pair: cv-solo, n: 120}
  - {group: cv-solo, name: cv-solo-cross, kind: pos, schedule: full, k: 0, duration: [4, 12], target_pool: cv_en, interferer_pool: cvi_en, enroll_pool: cv_zh, pair: cv-solo, n: 120}
  - {group: cv-k1, name: cv-k1-same, kind: pos, schedule: full, k: 1, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_en, interferer_pool: cvi_en, enroll_pool: cv_en, pair: cv-k1, n: 120}
  - {group: cv-k1, name: cv-k1-cross, kind: pos, schedule: full, k: 1, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_en, interferer_pool: cvi_en, enroll_pool: cv_zh, pair: cv-k1, n: 120}
  - {group: cv-k2, name: cv-k2-same, kind: pos, schedule: full, k: 2, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_en, interferer_pool: cvi_en, enroll_pool: cv_en, pair: cv-k2, n: 120}
  - {group: cv-k2, name: cv-k2-cross, kind: pos, schedule: full, k: 2, duration: [6, 15], sir_db: [-3, 3], target_pool: cv_en, interferer_pool: cvi_en, enroll_pool: cv_zh, pair: cv-k2, n: 120}
  - {group: cv-abs1, name: cv-abs1-same, kind: neg, k: 1, duration: [6, 15], target_pool: cv_en, interferer_pool: cvi_en, enroll_pool: cv_en, pair: cv-abs1, n: 120}
  - {group: cv-abs1, name: cv-abs1-cross, kind: neg, k: 1, duration: [6, 15], target_pool: cv_en, interferer_pool: cvi_en, enroll_pool: cv_zh, pair: cv-abs1, n: 120}
  - {group: cv-abs2, name: cv-abs2-same, kind: neg, k: 2, duration: [6, 15], target_pool: cv_en, interferer_pool: cvi_en, enroll_pool: cv_en, pair: cv-abs2, n: 120}
  - {group: cv-abs2, name: cv-abs2-cross, kind: neg, k: 2, duration: [6, 15], target_pool: cv_en, interferer_pool: cvi_en, enroll_pool: cv_zh, pair: cv-abs2, n: 120}
  - {group: tts-solo, name: tts-solo-same, kind: pos, schedule: full, k: 0, duration: [4, 12], target_pool: tts_en, interferer_pool: tts_en, enroll_pool: tts_en, pair: tts-solo, n: 100}
  - {group: tts-solo, name: tts-solo-cross, kind: pos, schedule: full, k: 0, duration: [4, 12], target_pool: tts_en, interferer_pool: tts_en, enroll_pool: tts_zh, pair: tts-solo, n: 100}
  - {group: tts-k1, name: tts-k1-same, kind: pos, schedule: full, k: 1, duration: [6, 15], sir_db: [-3, 3], target_pool: tts_en, interferer_pool: tts_en, enroll_pool: tts_en, pair: tts-k1, n: 100}
  - {group: tts-k1, name: tts-k1-cross, kind: pos, schedule: full, k: 1, duration: [6, 15], sir_db: [-3, 3], target_pool: tts_en, interferer_pool: tts_en, enroll_pool: tts_zh, pair: tts-k1, n: 100}
  - {group: tts-k2, name: tts-k2-same, kind: pos, schedule: full, k: 2, duration: [6, 15], sir_db: [-3, 3], target_pool: tts_en, interferer_pool: tts_en, enroll_pool: tts_en, pair: tts-k2, n: 100}
  - {group: tts-k2, name: tts-k2-cross, kind: pos, schedule: full, k: 2, duration: [6, 15], sir_db: [-3, 3], target_pool: tts_en, interferer_pool: tts_en, enroll_pool: tts_zh, pair: tts-k2, n: 100}
  - {group: tts-abs1, name: tts-abs1-same, kind: neg, k: 1, duration: [6, 15], target_pool: tts_en, interferer_pool: tts_en, enroll_pool: tts_en, pair: tts-abs1, n: 100}
  - {group: tts-abs1, name: tts-abs1-cross, kind: neg, k: 1, duration: [6, 15], target_pool: tts_en, interferer_pool: tts_en, enroll_pool: tts_zh, pair: tts-abs1, n: 100}
  - {group: tts-abs2, name: tts-abs2-same, kind: neg, k: 2, duration: [6, 15], target_pool: tts_en, interferer_pool: tts_en, enroll_pool: tts_en, pair: tts-abs2, n: 100}
  - {group: tts-abs2, name: tts-abs2-cross, kind: neg, k: 2, duration: [6, 15], target_pool: tts_en, interferer_pool: tts_en, enroll_pool: tts_zh, pair: tts-abs2, n: 100}
