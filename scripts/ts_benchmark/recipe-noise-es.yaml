# 西班牙语版：与英文版（recipe-noise-en.yaml）同一场景、随机种子与噪声，说话人换成 Common Voice es dev（同 recipe-es.yaml）。
# 目标说话人评测集的噪声补充（ts_asr_noise）：用新登记的噪声集（合成背景人声 babble、FSD50K）扩充脆弱性面板。
# 基线场景与 ts_asr_benchmark v3 的 panel-base 逐条相同（同样的配对键和参数），所以可以直接与 v3 的面板结果比较。
version: es-v1-20261111
enroll_store_seconds: 10
dataset_id: ts_asr_noise
language: es
description: 西班牙语目标说话人 ASR 评测集（ts_asr_noise）：与英文版 en-v1-20261031 同一配方与随机种子，说话人换成 Common Voice es dev（众包朗读、多口音、各自设备）；没有英文版的背景人声（babble）各列：已登记的西语 babble 都由训练划分的说话人合成，评测不能用；不含业务真实注册录音条件。只用于评测，不进训练。场景见 scripts/ts_benchmark/recipe-noise-es.yaml。
seed: 20261013
sample_rate: 16000

# 说话人来自训练没有用过的划分：Common Voice es dev（训练只用 train；CV 各划分说话人不重叠）。CV es test 每人平均 2.5 句，凑不够每人 6 句，所以用 dev。
pools:
  read:
    description: Common Voice es dev，众包朗读、多口音，至少 6 句 1.5–9 秒的说话人
    sources:
      - {dataset: common_voice_es, version: legacy, split: dev}
  mixed:
    description: 与 read 相同（只有一个池）
    union: [read]
utterance_seconds: [1.5, 9.0]
short_utterance_seconds: [0.5, 1.6]
min_utterances_per_speaker: 6

noise:
  musan_noise: {dataset: musan, version: legacy-20260804, split: noise}
  musan_music: {dataset: musan, version: legacy-20260804, split: music}
  traffic: {dataset: audioset_road_traffic, version: legacy-20260804, split: all}
  # FSD50K 评测划分（noise_open），与英文版相同。
  # 英文版的背景人声（babble_en，babble_noise_synth 的 en test）没有西语评测版：已登记的西语 babble
  # （babble_noise_train@es-v1-20261110 及由它切出的 ts_nonspeech_pool@es-babble-20261110）说话人取自 CV es / MLS es train，
  # 是训练数据，评测不能用；所以 babble20 / babble10 / babble5 与 nonspeech-babble 不建。
  fsd_events:
    alias: open_noise
    fsd: {split: eval, min_seconds: 5, count: 400,
          include: [Domestic_sounds_and_home_sounds, Motor_vehicle_(road), Door, Water, Engine, Mechanisms, Alarm, Wind, Rain],
          exclude: [Human_voice, Music, Musical_instrument, Speech, Singing, Crowd, Chatter]}
  fsd_crowd:
    alias: open_noise
    fsd: {split: eval, min_seconds: 3, count: 400, include: [Crowd, Chatter], exclude: [Music, Singing, Applause, Cheering]}
rir:
  archive: /workspace/data/DATA-TTS/dns5/datasets_fullband.impulse_responses_000.tar.bz2
  count: 300

default_n: 120

noise_floor:
  dbfs: [-65, -35]
  kinds: {white: 0.15, pink: 0.15, real: 0.70}
  real_pools: [wham, dns5_audioset, dns5_freesound]

splits:
  # 与 v3 面板共用的基线（同一批场景）
  - {group: noise, name: panel-base-pos, kind: pos, schedule: full, k: [1, 2], duration: [6, 15], sir_db: [-3, 3], pair: panel-pos, n: 120}
  - {group: noise, name: panel-base-neg, kind: neg, k: [1, 2], duration: [6, 15], pair: panel-neg, n: 120}
  - group: noise
    n: 120
    expand:
      pair: "panel-{kind}"   # 与基线（以及 v3 的面板）共用同一批场景
      template: "{cond}-{kind}"
      over:
        cond: [events20, events10, crowd10]
        kind: [pos, neg]
      cond_params:
        events20: {noise: {kind: fsd_events, snr_db: [20, 20]}}
        events10: {noise: {kind: fsd_events, snr_db: [10, 10]}}
        crowd10: {noise: {kind: fsd_crowd, snr_db: [10, 10]}}
    base:
      pos: {kind: pos, schedule: full, k: [1, 2], duration: [6, 15], sir_db: [-3, 3]}
      neg: {kind: neg, k: [1, 2], duration: [6, 15]}
  # 没有目标、也没有人说话的背景
  - {group: noise, name: nonspeech-crowd, kind: nonspeech, duration: [1, 15], noise: {kind: fsd_crowd, level_dbfs: [-40, -25]}}
  - {group: noise, name: nonspeech-events, kind: nonspeech, duration: [1, 15], noise: {kind: fsd_events, level_dbfs: [-40, -25]}}
