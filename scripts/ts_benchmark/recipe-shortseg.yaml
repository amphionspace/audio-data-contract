# 目标说话人评测集的短片段补充（ts_asr_shortseg）：业务第三批反馈（business_feedback@ts-20261016）里
# 28 条错误中有 17 条是 1.2–6 秒、注册人没说话、别人在说话的片段（持续收音时 VAD 切出的长度），
# 而 ts_asr_benchmark 的缺席场景只有 0.4–1.2 秒（abs-short）和 6–18 秒两档。这里补上中间的长度。
# 干扰人从片段开头附近开始说话（VAD 切出的片段以语音开头）；底噪与 v3 相同。
version: v1-20261017
dataset_id: ts_asr_shortseg
seed: 20261017
sample_rate: 16000

pools:
  studio:
    description: AISHELL-3 test，棚内高质量朗读，214 位说话人，有性别标注
    sources:
      - {dataset: aishell3, version: legacy-20260804, split: test}
  phone:
    description: KeSpeech test（手机录音，含方言口音，取 250 位）、MagicData test、AISHELL-2 test（手机）
    sources:
      - {dataset: kespeech, version: legacy-20260804, split: test, max_speakers: 250}
      - {dataset: magicdata, version: legacy-20260804, split: test}
      - {dataset: aishell2, version: legacy-20260804, split: test}
  read:
    description: AISHELL-1 test，麦克风朗读，20 位说话人
    sources:
      - {dataset: aishell, version: legacy-20260804, split: test}
  mixed:
    description: 上面三个池的并集
    union: [studio, phone, read]
utterance_seconds: [1.5, 9.0]
short_utterance_seconds: [0.5, 1.6]
min_utterances_per_speaker: 6

noise:
  musan_noise: {dataset: musan, version: legacy-20260804, split: noise}
rir:
  archive: /workspace/data/DATA-TTS/dns5/datasets_fullband.impulse_responses_000.tar.bz2
  count: 300

default_n: 120

noise_floor:
  dbfs: [-65, -35]
  kinds: {white: 0.15, pink: 0.15, real: 0.70}
  real_pools: [wham, dns5_audioset, dns5_freesound]

enrollment_files:
  realreg2: {alias: business_feedback, path: source/ts-20261012/audio/enrollment-9416898a6f00.wav}

splits:
  # 注册人缺席，1.2–3 秒与 3–6 秒，1 或 2 个干扰人；期望输出为空。
  - {group: shortseg, name: abs-mid1-k1, kind: neg, k: 1, duration: [1.2, 3.0], interferer_start: [0.0, 0.3]}
  - {group: shortseg, name: abs-mid1-k2, kind: neg, k: 2, duration: [1.2, 3.0], interferer_start: [0.0, 0.3]}
  - {group: shortseg, name: abs-mid2-k1, kind: neg, k: 1, duration: [3.0, 6.0], interferer_start: [0.0, 0.3]}
  - {group: shortseg, name: abs-mid2-k2, kind: neg, k: 2, duration: [3.0, 6.0], interferer_start: [0.0, 0.3]}
  # 业务第二、三批测试人员的真实注册录音（realreg2），同样的长度。
  - {group: shortseg, name: realreg2-mid1-neg, kind: neg, k: [1, 2], duration: [1.2, 3.0], interferer_start: [0.0, 0.3], enroll_file: realreg2}
  - {group: shortseg, name: realreg2-mid2-neg, kind: neg, k: [1, 2], duration: [3.0, 6.0], interferer_start: [0.0, 0.3], enroll_file: realreg2}
  # 对照：目标单独说一句短话（2–6 秒），检查压低误输出时没有漏掉注册人的短句。
  - {group: shortseg, name: solo-mid, kind: pos, schedule: full, k: 0, duration: [2.0, 6.0]}
