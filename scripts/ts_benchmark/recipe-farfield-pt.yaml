# 葡萄牙语版：与西语版（recipe-farfield-es.yaml）、英文版（recipe-farfield-en.yaml）同一场景、随机种子与噪声，说话人换成 Common Voice 27.0 pt dev（同 recipe-pt.yaml）。
# 目标说话人评测集的远场补充（ts_asr_farfield）：目标和干扰人各自的房间响应（RIR），以及注册近场、混合远场的失配。
# 基线场景与 ts_asr_benchmark v3 的 panel-base 逐条相同，所以可以直接与 v3 的面板结果比较。
# 房间响应用 SLR28 实测（real 池）；远场 = 说话人过房间响应（保持干电平），近场 = 干。
version: pt-v1-20261117
enroll_store_seconds: 10
dataset_id: ts_asr_farfield
language: pt
description: 葡萄牙语目标说话人 ASR 评测集（ts_asr_farfield）：与西语版 es-v1-20261111、英文版 en-v1-20261031 同一配方与随机种子，说话人换成 Common Voice 27.0 pt dev（众包朗读，多为巴西口音，各自设备）；不含业务真实注册录音条件。只用于评测，不进训练。场景见 scripts/ts_benchmark/recipe-farfield-pt.yaml。
seed: 20261013
sample_rate: 16000

# 说话人来自训练没有用过的划分：Common Voice 27.0 pt dev（common_voice_pt@pt-eval-v1-20261117，与葡语训练版本说话人、句子零重叠，见 recipe-pt.yaml）。
pools:
  read:
    description: Common Voice 27.0 pt dev，众包朗读，至少 6 句 1.5–9 秒的说话人
    sources:
      - {dataset: common_voice_pt, version: pt-eval-v1-20261117, split: dev}
  mixed:
    description: 与 read 相同（只有一个池）
    union: [read]
utterance_seconds: [1.5, 9.0]
short_utterance_seconds: [0.5, 1.6]
min_utterances_per_speaker: 6

noise:
  musan_noise: {dataset: musan, version: legacy-20260804, split: noise}
  musan_music: {dataset: musan, version: legacy-20260804, split: music}
  traffic: {dataset: audioset_road_traffic, version: legacy-20260804, split: all}
rir:
  archive: /workspace/data/DATA-TTS/dns5/datasets_fullband.impulse_responses_000.tar.bz2
  count: 300

default_n: 120

noise_floor:
  dbfs: [-65, -35]
  kinds: {white: 0.15, pink: 0.15, real: 0.70}
  real_pools: [wham, dns5_audioset, dns5_freesound]

splits:
  - {group: farfield, name: panel-base-pos, kind: pos, schedule: full, k: [1, 2], duration: [6, 15], sir_db: [-3, 3], pair: panel-pos, n: 120}
  - {group: farfield, name: panel-base-neg, kind: neg, k: [1, 2], duration: [6, 15], pair: panel-neg, n: 120}
  - group: farfield
    n: 120
    expand:
      pair: "panel-{kind}"   # 与基线共用同一批场景
      template: "{cond}-{kind}"
      over:
        cond: [rirtgt, rirint, rirsame, rirdiff, mmfarfar, mmfarnear]
        kind: [pos, neg]
      cond_params:
        rirtgt: {rir: {target: real}}
        rirint: {rir: {interferer: real}}
        rirsame: {rir: {target: real, interferer: real, share: true}}
        rirdiff: {rir: {target: real, interferer: real}}
        mmfarfar: {rir: {target: real, interferer: real}, enroll: reverb, enroll_rir_pool: real}
        mmfarnear: {enroll: reverb, enroll_rir_pool: real}
    base:
      pos: {kind: pos, schedule: full, k: [1, 2], duration: [6, 15], sir_db: [-3, 3]}
      neg: {kind: neg, k: [1, 2], duration: [6, 15]}
