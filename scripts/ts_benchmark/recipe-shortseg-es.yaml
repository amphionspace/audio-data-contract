# 西班牙语版：与英文版（recipe-shortseg-en.yaml）同一场景、随机种子与噪声，说话人换成 Common Voice es dev（同 recipe-es.yaml）。
# 目标说话人评测集的短片段补充（ts_asr_shortseg）：业务第三批反馈（business_feedback@ts-20261016）里
# 28 条错误中有 17 条是 1.2–6 秒、注册人没说话、别人在说话的片段（持续收音时 VAD 切出的长度），
# 而 ts_asr_benchmark 的缺席场景只有 0.4–1.2 秒（abs-short）和 6–18 秒两档。这里补上中间的长度。
# 干扰人从片段开头附近开始说话（VAD 切出的片段以语音开头）；底噪与 v3 相同。
version: es-v1-20261111
enroll_store_seconds: 10
dataset_id: ts_asr_shortseg
language: es
description: 西班牙语目标说话人 ASR 评测集（ts_asr_shortseg）：与英文版 en-v1-20261031 同一配方与随机种子，说话人换成 Common Voice es dev（众包朗读、多口音、各自设备）；没有英文版的对照 solo-mid（CV es dev 的句子太长，排不出 2–6 秒的单句片段）；不含业务真实注册录音条件。只用于评测，不进训练。场景见 scripts/ts_benchmark/recipe-shortseg-es.yaml。
seed: 20261017
sample_rate: 16000

# 说话人来自训练没有用过的划分：Common Voice es dev（训练只用 train；CV 各划分说话人不重叠）。CV es test 每人平均 2.5 句，凑不够每人 6 句，所以用 dev。
pools:
  read:
    description: Common Voice es dev，众包朗读、多口音，至少 6 句 1.5–9 秒的说话人
    sources:
      - {dataset: common_voice_es, version: legacy, split: dev}
  mixed:
    description: 与 read 相同（只有一个池）
    union: [read]
utterance_seconds: [1.5, 9.0]
short_utterance_seconds: [0.5, 1.6]
min_utterances_per_speaker: 6

noise:
  musan_noise: {dataset: musan, version: legacy-20260804, split: noise}
rir:
  archive: /workspace/data/DATA-TTS/dns5/datasets_fullband.impulse_responses_000.tar.bz2
  count: 300

default_n: 120

noise_floor:
  dbfs: [-65, -35]
  kinds: {white: 0.15, pink: 0.15, real: 0.70}
  real_pools: [wham, dns5_audioset, dns5_freesound]

splits:
  # 注册人缺席，1.2–3 秒与 3–6 秒，1 或 2 个干扰人；期望输出为空。
  - {group: shortseg, name: abs-mid1-k1, kind: neg, k: 1, duration: [1.2, 3.0], interferer_start: [0.0, 0.3]}
  - {group: shortseg, name: abs-mid1-k2, kind: neg, k: 2, duration: [1.2, 3.0], interferer_start: [0.0, 0.3]}
  - {group: shortseg, name: abs-mid2-k1, kind: neg, k: 1, duration: [3.0, 6.0], interferer_start: [0.0, 0.3]}
  - {group: shortseg, name: abs-mid2-k2, kind: neg, k: 2, duration: [3.0, 6.0], interferer_start: [0.0, 0.3]}
  # 英文版的对照 solo-mid（目标单独说一句短话，2–6 秒片段）不建：目标句须不长于片段的 60%（≤3.6 秒），
  # CV es dev 的句子几乎都长于 3 秒（全部 15,900 句里 ≤3 秒的只有 216 句），按同一种子 40 次重抽仍有样本排不出。
  # 注册人在场的召回对照看 ts_asr_benchmark@es-v1-20261110 的 dyn-solo。
