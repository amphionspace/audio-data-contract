# 目标说话人评测集的歌声补充（ts_asr_singing）：业务第三批反馈（business_feedback@ts-20261016）里有 3 条片段
# 只有歌声（pad 外放带伴奏的歌，2.6–6.6 秒，片段 RMS 约 −27 到 −15 dBFS），注册人没说话，模型复读或输出歌词；
# ts_asr_benchmark 的音乐来自 MUSAN，基本没有人声歌曲。这里用 MIR-1K 的中文流行歌（人声 + 伴奏）补上。
version: en-v1-20261031
enroll_store_seconds: 10
dataset_id: ts_asr_singing
language: en
description: 英文目标说话人 ASR 评测集（ts_asr_singing）：与中文版同一配方与随机种子，说话人换成 VCTK、CS-Dialogue 英文 test、LibriSpeech test-clean/test-other；不含业务真实注册录音条件。只用于评测，不进训练。场景见 scripts/ts_benchmark/recipe-singing-en.yaml。
seed: 20261017
sample_rate: 16000

# 说话人来自训练没有用过的英文语料：LibriSpeech、CS-Dialogue 取官方 test 划分；VCTK 训练从未使用（无官方划分）。
pools:
  studio:
    description: VCTK 棚内录音（mic1），109 位说话人、多种英语口音，每人取 80 句（export_tts_pool.py 导出）
    sources:
      - {dataset: vctk, version: tts-unified-v0.1, split: train, manifest: {alias: aidc_data, path: datasets/ts_asr_benchmark/source/pools/vctk-tts-unified-v0.1-mic1/utterances.jsonl.gz}}
  phone:
    description: CS-Dialogue 英文 test，中国说话人用英语自由对话、各自设备录音（有口音），27 位可用说话人
    sources:
      - {dataset: cs_dialogue_en, version: legacy-20260804, split: test, skip_text: "<NPS/>|\\*\\*"}  # <NPS/>（旁人说话）和 **（听不清）的句子不用；其余标签（<FIL/> 等）去掉
  read:
    description: LibriSpeech test-clean 与 test-other，有声书朗读，73 位说话人
    sources:
      - {dataset: librispeech, version: legacy-20260804, split: test_clean}
      - {dataset: librispeech, version: legacy-20260804, split: test_other}
  mixed:
    description: 上面三个池的并集
    union: [studio, phone, read]
utterance_seconds: [1.5, 9.0]
short_utterance_seconds: [0.5, 1.6]
min_utterances_per_speaker: 6

noise:
  # MIR-1K 卡拉 OK 片段：读入时左（伴奏）右（人声）声道取平均，即带伴奏的歌
  fsd_singing:  # 英文版：MIR-1K 是中文卡拉 OK，改用 FSD50K eval 中标为歌声的片段（不含说话）
    alias: open_noise
    fsd: {split: eval, min_seconds: 3, count: 300, include: [Singing, Male_singing, Female_singing, Choir, Yodeling],
          exclude: [Speech, Male_speech_and_man_speaking, Female_speech_and_woman_speaking, Conversation, Child_speech_and_kid_speaking, Speech_synthesizer]}
rir:
  archive: /workspace/data/DATA-TTS/dns5/datasets_fullband.impulse_responses_000.tar.bz2
  count: 300

default_n: 120

noise_floor:
  dbfs: [-65, -35]
  kinds: {white: 0.15, pink: 0.15, real: 0.70}
  real_pools: [wham, dns5_audioset, dns5_freesound]

splits:
  # 只有歌声，注册人不在场；期望输出为空。
  - {group: singing, name: nonspeech-song, kind: nonspeech, duration: [1.5, 8.0], noise: {kind: fsd_singing, level_dbfs: [-30, -15]}}
