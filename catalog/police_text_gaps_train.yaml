  provenance:
    preparation_status: prepared
    superseded_by: police_text_gaps_train@v2-20261123
    owner: mingdong
    summary: 警务训练文本缺口的按类别补量
    description: >-
      small70m 警务微调 v3 的跟踪分析发现，6 个测试里的说法在两份警务训练文本（police_v6_8h train、police_asr_unified train）里没有，
      或只有反义、同音的说法，微调后大面积识别错：调到最暗（识别成调到最亮）、三百秒（三十秒）、设为自动、红外夜视（夜市）、静默取证、林区卡口（邻区）。
      这一版按类别补训练语音，custom.category 标出类别：darkest 反义（调到最暗、调暗、最暗，约三成同句带最亮/调亮作对比）、
      hundred_seconds 取值（三百秒等整百秒数，约四分之一同句带三十秒）、auto 取值（设为自动）、night_vision 易混（夜视，部分同句带夜市）、
      silent_evidence 静默取证、forest 易混（林区，部分同句带邻区）。
      这些说法在测试集里来自 V6 留在测试集的 5 条指令（把记录仪亮度调到最暗、把延录时长设置为300秒、把AI识别距离设置为自动、关闭红外、记录仪音量调到最小）；
      按用户 2026-11-23 的选择不使用这 5 条指令，也不使用其他留在 dev/test 的 V6 指令（延录 60 秒、预录 10 秒、分段 5 分钟、识别距离等），
      保持 V6 测试集仍测没见过的指令。文本由 Seed 2.0 Pro 生成，规则过滤后与 police_asr_unified@v1-20261009 train/dev/test 去重；
      标注只用汉字和全角“，。？！、；”，以“。？！”结尾，数字写汉字。Qwen3-TTS-12Hz-1.7B-Base 克隆原警务数据 nationwide_v2_480 的 train 口音说话人
      （参考同 police_terms_single_train@v1-20261023，不含粤语，去掉其中合成通过率 < 50% 的 20 人），每句 4 人。
    source: icefall egs/amphion/docs/finetune_small70m_police_v3_20261122.md（警务训练文本的缺口清单）
    run_dir: /workspace/workspace/mingdong/data/amphiondata/police-text-gaps-train-20261123
    code: amphiondata main（MR !34，8575a35），scripts/synthetic/run_police_text_gaps.py
    qc: >-
      Qwen3-ASR-1.7B 转写后：生成到码字上限的丢弃；数值时长（X十秒、X百秒）按字、暗/亮按拼音 an/liang 的个数必须与标注相同（防读反、读错数值）；
      目标说法按口音宽松的拼音（前后鼻音、平翘舌、n/l 不分）必须整段听到；不带声调的拼音对齐多出加缺少超过 2 个音节、替换超过 15% 的丢弃。
      核对方能力：测试集里含这些说法的 150 条音频，Qwen3-ASR 关键词判对 148 条。合成 12,040 条，通过 11,858 条（98.5%），每类按配额、按轮次取。
      拒绝原因逐类看过（生成到上限抽 20，其余全看）：生成到上限 72 条约无误杀；读反/数值不符 43 条、目标说法没听到 36 条误杀约 2/3 和 7 成
      （口音 an→ai、bai→ba，生僻说法被识别成别的词），因为正是关键词读音拿不准的录音、合计只占 0.66%，仍丢弃；多出或缺少音节 23 条误杀约 2 成。
      被拒率 KeSpeech 0.9%、四川话 5.4%、吴语 5.6%，导出后吴语占比 8.0%→7.7%。与 police_asr_unified dev/test 文本、说话人交集均为 0。
    known_issues:
    - 全部为合成语音，没有人工听审
    - 不含 V6 留出的 5 条指令，V6 测试集上这些说法能改善多少要训完才知道
    - 林区卡口只有 133 条（林区类整体 513 条）
    - 方言参考的合成失败率较高，吴语、四川话占比比合成时略低
  recipe_parameters:
    text_model: doubao-seed-2-0-pro-260215
    tts_provider: qwen3_tts
    tts_model: Qwen3-TTS-12Hz-1.7B-Base
    max_new_tokens: min(360, max(64, 5 × 字数))
    voices_per_text: 4
    asr_check: Qwen3-ASR-1.7B
    speaker_split: train (nationwide_v2_480 384/48/48)，不含粤语
    sample_rate: 16000
    channels: 1
