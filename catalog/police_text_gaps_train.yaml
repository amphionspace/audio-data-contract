    owner: mingdong
    summary: 警务训练文本缺口的按类别补量
    description: >-
      small70m 警务微调 v3 的跟踪分析发现，6 个测试里的说法在两份警务训练文本（police_v6_8h train、police_asr_unified train）里没有，
      或只有反义、近音的说法，微调后大面积识别错：调到最暗（识别成调到最亮）、三百秒（三十秒）、设为自动、红外夜视（夜市）、静默取证、林区卡口（邻区）。
      这一版按类别补训练语音：反义词（调暗、最暗）、取值（三百秒等整百秒数、设为自动）、易混词（夜视、林区）和静默取证。
      这些说法在测试集里来自 V6 留出的 5 条指令（把记录仪亮度调到最暗、把延录时长设置为300秒、把AI识别距离设置为自动、关闭红外、记录仪音量调到最小），
      按用户 2026-11-23 的选择不使用这 5 条指令，保持 V6 测试集仍测没见过的指令；文本与警务 train/dev/test 去重。
      Seed 2.0 Pro 生成文本，Qwen3-TTS 1.7B Base 克隆原警务数据的 train 口音说话人，Qwen3-ASR 核对。只有训练集。
