    description: >-
      Sully.ai 把四个公开的医患对话数据整理成统一格式（2026-11 发布）。有音频的部分：272 场 Fareez 等人（Scientific Data 2022）的
      加拿大 OSCE 问诊录音，医生与扮演患者按病例卡即兴问诊，以呼吸科为主（呼吸 213、肌骨 46、消化 6、心血管 5、皮肤和综合各 1），
      共 51.9 小时，原始数据在 figshare 上以 CC0 发布（本机访问 figshare 返回 403，所以从这份整理版获取）；另 57 场 PriMock57，
      医生和患者两轨被混成单声道，与本项目已有的 primock57 是同一批问诊，所以这一划分加了 group，不计入总时长。音频统一转成
      16 kHz 单声道 MP3，转写按 Clinician/Patient/Family member 分轮次（OSCE 26,572 轮），连续同一说话人的轮次已合并，没有逐句时间。
      卡片称全部是角色扮演、人工转写，原论文的转写流程未核对。encounters.jsonl 另含 207 场 ACI-Bench 和 MTS-Dialog 1,701 段
      对话文本（无音频），可用于对话转病历的文本评测。整体按 CC BY 4.0 分发，每行带来源许可证。
