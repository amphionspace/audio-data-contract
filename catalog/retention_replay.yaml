  provenance:
    summary: 原版 Qwen3-ASR 标注的多语种保持数据
    description: 9 种语言（德、法、葡、意、荷、日、韩、俄、阿）的训练音频，每种抽 6,000 条 2–20 秒，目标为冻结的 Qwen3-ASR-1.7B 强制语言后的转写，用于训练时保持原版在这些语言上的能力（KL 保持）。Common Voice、MLS 引用原文件；mls_sidon 的意、荷只取原始 MLS train 划分，转成 16 kHz FLAC 存在本版本 audio/。与语料原文的错误率超过 0.5 的条目丢弃，原文保留在 metadata.corpus_text。
    owner: mingdong
    snapshot_date: '2026-11-24'
    run_dir: /workspace/data/datasets/retention_replay
    source:
    - common_voice_ar@legacy:train
    - common_voice_de@legacy:train
    - common_voice_fr@legacy:train
    - common_voice_ja@legacy:train
    - common_voice_ko@legacy:train
    - common_voice_pt@pt-train-v1-20261117:train
    - common_voice_ru@legacy:train
    - mls_de@legacy:train_punc
    - mls_fr@legacy:train_punc
    - mls_pt@pt-train-v1-20261117:train
    - mls_sidon@v0.1:train (original MLS split train; it, nl)
    method: 原版模型强制语言转写作为目标（自蒸馏），按与语料原文的错误率筛选
    recipe_parameters:
      label_model: Qwen3-ASR-1.7B（/workspace/model/Qwen3-ASR-1.7B），vLLM 0.18.0
      chat_template: amphion-eval defaults/chat-templates/qwen3-asr-force-language.jinja，chat_template_kwargs.force_language
      temperature: 0.0
      max_tokens: 256
      per_language: 6000
      duration_seconds:
      - 2.0
      - 20.0
      selection: 每个来源按片段 ID 的 SHA-256 取最小的若干条
      max_label_error: 0.5
      label_error: 两边 NFKC、去组合符号（日语除外）、小写、去非文字字符；日、韩按字，其余按词
    known_issues:
    - '未按文本排除与公开测试集相同的句子：留到训练配置里统一做（open-audio-llm #175 decontaminate_training_data.py），直接拿来训练前要先做这一步。'
    - 韩语 Common Voice 训练集只有 657 条可用，训练权重应按条数缩小。
    - 目标是原版模型的输出，包含原版自己的错误；只适合作保持目标，不适合当真值评测。
    license: Common Voice CC0；MLS CC BY 4.0
    build_script: scripts/retention_replay/build.py
