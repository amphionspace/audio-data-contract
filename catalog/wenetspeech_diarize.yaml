  provenance:
    summary: WenetSpeech 长音频的说话人日志伪标签
    preparation_status: prepared
    owner: mingdong
    description: >-
      WenetSpeech L 训练集原始长音频（≥120 秒，51,358 条 / 22,174 h）的说话人日志伪标签，流程同 emilia2_zh_dialogue_diarize：
      本地 MOSS-Transcribe-Diarize 0.9B 整条打说话人和文本，粗筛多人录音（≥2 人且每人 ≥5 秒，保留 37,153 条 / 19,970.4 h），
      在停顿处切 30–120 秒窗口，Qwen3-ASR 整窗识别，文字差异 ≤ 15% 的窗口整体保留（607,243 个 / 17,185.5 h，丢 2,754 h，主要是 text_check_mismatch 2,330.8 h）。
      WenetSpeech 没有带说话人的上游标注，不做说话人检查。按试跑（以 MOSS Pro 为参照）与听审的方案 B 分两个划分：
      train_120s 是本地 MOSS 判为 2 人的窗口（170,418 个 / 4,626.3 h，试跑好窗口约 91%），作为主数据；
      train_120s_lowconf 是其余窗口（1 人 2,300.3 h、3 人 3,502.1 h、4 人以上 6,756.8 h；试跑好窗口 54–74%），不并入主数据，按需选用。
      音频直接引用 wenetspeech@legacy-20260804 的原始 opus，记录按 cut_id + start/duration 引用。试跑、听审、被拒样本见 run_dir README。
    source: wenetspeech@legacy-20260804
    annotation: moss-transcribe-diarize-0.9b+qwen3-asr-window-check(cer<=15)
    window_rule: windows kept whole by the window text check; split by local MOSS speaker count
    known_issues:
      - 本地 MOSS 在 WenetSpeech 上主要会把同一人拆成几个编号（听审 5/5），4 人以上窗口 Pro 多认为是 2–3 人；低置信度划分慎用
      - 窗口里有人说话只占约 60%（音乐、静音、片头片尾），漏标的歌词和背景广播多数已被文字核对挡掉
    run_dir: /workspace/workspace/mingdong/data/amphiondata/wenetspeech-l-diarize-20261012
  recipe_parameters:
    diarization_model: MOSS-Transcribe-Diarize-0.9B
    prescreen: at_least_2_speakers_each_5s
    window_seconds: [30, 120]
    text_check_model: Qwen3-ASR-1.7B
    text_check_unit: window
    max_text_cer: 15
    main_split_rule: local_moss_speaker_count == 2
