    description: >-
      Intron Health 的 AfriSpeech-Dialog v1（NAACL 2025）：尼日利亚、肯尼亚和南非说话人的英语双人自由对话，20 段模拟医患问诊、
      29 段一般话题讨论，共 49 段、7.0 小时（卡片写 50 段，仓库实际 49 段）。远程录制，环境各异，44.1 kHz 单声道 WAV；
      口音覆盖豪萨、斯瓦希里、伊索科、约鲁巴、塞索托等 11 种母语背景，说话人多为 19–40 岁。metadata.csv 里每段是一整篇
      按 Speaker 1/2 分轮次的人工转写（医疗 1,568 轮、一般话题 883 轮），大多穿插 hh:mm:ss 时间点，但没有逐句起止时间，
      做 ASR 训练或带说话人识别评测前需要先强制对齐。适合非洲口音英语对话识别和医疗问诊场景评测。CC BY-NC-SA 4.0。
