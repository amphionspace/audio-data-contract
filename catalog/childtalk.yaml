      description: >-
        南开大学（NKU-HLT）发布的中文儿童对话语料（ACL 2026 Findings）：500 位 2.5–8 岁儿童各与一位看护人（多为父母）对话，
        共 504 段、125.4 小时，16 kHz 单声道 WAV。覆盖普通话（38.4 小时）、西南官话（35.2 小时）、胶辽、中原、东北、兰银、冀鲁、
        江淮、北京官话，以及晋语和闽南语。short/ 是按句切出的 88,943 条（112.5 小时，其中儿童 51,075 条、84.1 小时，其余是看护人），
        long/ 是整段录音，information/long 下每段一个带起止时间和说话人编号的 TSV 转写。train/dev/test 按对话划分，儿童和看护人在
        三个划分之间都不重叠。转写标出 <NON/>、<UNK/>、<BREATH/>、<LAUGH/> 等事件和 <OVERLAP> 重叠。数据以 23 个 1 GB 分卷的
        childtalk.tar.gz 发布，需先拼接再解压。U4xxx_U5xxx 系列的 104 段长对话转写里 wav_id 列与文件名和短句编号不一致
        （如 U4024_U5024_S0.txt 里写成 U1024_U2024_S0_1_none），按文件名和行序对应。CC BY-NC-SA 4.0，仅限非商业学术研究，
        数据卡还要求使用者遵守数据使用协议、不得尝试识别参与者身份。
