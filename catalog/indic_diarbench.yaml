      release_date: '2026-07-25'
      description: >-
        Sarvam AI 2026-07 发布（Interspeech 2026）的印度语言说话人日志加转写评测集，覆盖全部 22 种官方语言，1,164 段、107.7 小时，
        98,545 个人工校正的带时间戳、带说话人的转写段，平均重叠约 12.8%。三种录音条件：near_field 约 53.3 小时（线上会议，每人一个近讲麦克风），
        far_field 约 26.8 小时（远场麦克风，只有使用人数最多的 8 种语言），in_the_wild 约 27.7 小时（YouTube 视频，10 种语言）。
        每种语言一个 test Parquet，内嵌 16 kHz 单声道 WAV，字段含 recording_id、dataset_type、num_speakers、annotated_transcript
        （speaker_id、start_time、end_time、transcript），转写里英语借词附括号原文，听不清处标 <unintelligible>。只有测试集。CC BY 4.0。
      license:
        - cc-by-4.0
