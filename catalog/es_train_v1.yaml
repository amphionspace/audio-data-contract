      Verde/Monteverde，当负例会教模型拒绝与录音一致的写法），以及出现在本条文本里的。90,439 条（54.6%）有近音词，平均每条 2.943 个；近音词与评测正确词重叠 0。录音不复制，audio_index 指向 legacy 源文件。检索结果见 mined/confusables.jsonl.gz，质检与 20 条样例见 qc.yaml。
    sources:
    - common_voice_es@es-train-v1-20261108
    - hotword_bench@es-v1-20261111 (gold words excluded from the vocabulary)
    scripts:
    - scripts/hotword_bench/build_es_train_confusables.py
    - scripts/hotword_bench/recipe-es-train-hwconf-v1.yaml
    limitations: 近音词按拼写推出的读音键检索，不是声学相似度，也不覆盖英文专名的英语读法；词库只收标注里出现至少两次的词，仍有重复出现的 OCR / 拼写错误词（如 Ingalaterra、jesuchristo），也有同一人名的历史写法（Moctezuma/Montezuma），按规则分不出来；热词是 LLM 抽取、未经人工核对。
