  provenance:
    summary: 警务合成测试语音的干净及 7 种退化版本，只用于评测
    description: 警务合成语音鲁棒性监控集：60 条测试语音（police_synthetic_zh_accent@icefall-20260908 的 test、test_qwen3_tts、test_cosyvoice3 各 20 条）的干净版和 7 种退化版（foreground_snr5、foreground_snr0、local_gain_snr5、narrowband、eq_bandpass、rir、clipping），每个划分 60 条，共 480 条。内容与 icefall-20260908 逐条相同（文本、说话人、时长和音频文件都不变，音频不复制，索引指向数据集目录 source/ 下的原文件），只是改成 AudioRecord 并给每条换了不重复的 ID：<条件>-<子集>-audio-<hash>，子集为 test / test_qwen3_tts / test_cosyvoice3；原 cut ID 保留在 metadata.icefall_cut_id。icefall-20260908 的 cut ID 不含子集，每个划分 60 条只有 40 个不同 ID，按 ID 读取的评测器会报重复或丢样本。只用于评测，不进训练。
    known_issues:
    - 同一 hash 在 test 与 test_qwen3_tts（11 对）、test 与 test_cosyvoice3（9 对）中各出现一次：文本和说话人相同，音频不同。两条都保留，不要按 hash 或 metadata.icefall_cut_id 去重。
    - 全部为合成语音，只经过自动质检，没有人工听审。
    build_script: scripts/build_police_robust_monitor.py
