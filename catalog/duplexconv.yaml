      description: >-
        西工大 ASLP 与 QualiaLabs 2026-06 开源，93,709 段、2,000.2 小时（每段 8–618 秒，平均 76.8 秒）的中文多人自然对话，
        辅导课（Edu、edu，700.0 h）和闲聊（none_Edu，1,300.2 h）两类场景。每段一个 48 kHz 多声道 WAV（2–4 声道，标注按声道
        分开），打包在约 8 GB 的 tar 里；标注在各文件夹的 jsons.tar.gz，每段一个同名 JSON，按声道列出语句：起止时间、语种、
        LLM 打的性别/年龄/情感/口音/副语言标签和文本、轮次状态（complete、incomplete、backchannel、wait）、语句内的说话人分段、
        SNR、MOS 和声音事件。共 1,749,177 条语句、2,486.8 小时（重叠部分按每人分别计时）。转写和各类标签都由 LLM 辅助流水线
        生成，不是人工精标：6.6% 的语句没有文本，闲聊场景 41% 的语句没有轮次状态、20% 语种为 unknown；音频与标注一一对应。
        团队计划用 AmphionData 重新清洗转写后再用于训练。同系列的 100 小时人工精标版见 smoothconv。按文件大小和前 1 MiB
        内容比对，与 smoothconv 的 2,503 段没有完全相同的片段，但切分不同的同源录音无法据此排除。
        CC BY-NC 4.0，仅限学术研究。
