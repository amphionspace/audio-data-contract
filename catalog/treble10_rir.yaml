      description: >-
        Treble Technologies 2025-10 发布，用 Treble SDK 对 10 个带家具的真实户型房间（浴室、卧室、带/不带走廊的客厅、会议室各 2 个，
        14–46 m³）做混合仿真：5 kHz 以下用波动方程数值解（DG-FEM），以上用几何声学，覆盖 32 kHz 采样的全频带。每个房间 5 个声源、
        共 137 个接收点，rir_mono 和 rir_6ch（6 麦圆柱形设备）各 3,085 条，每条带房间、声源/接收点坐标、直达距离、分频带 EDT/T30/C50
        和吸声系数，平均 T30 0.17–0.94 秒。Parquet 内嵌 32 kHz 浮点 WAV，用于远场模拟前要重采样到 16 kHz。只下载了单声道和 6 声道部分，
        没有下载 8 阶 Ambisonics 子集（rir_hoa8，56 GB）。另有 geometry/ 下的房间和设备示意图。CC BY-NC-SA 4.0，仅限非商用。
