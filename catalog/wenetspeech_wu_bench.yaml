      description: >-
        西工大 ASLP 随 WenetSpeech-Wu 发布的人工整理吴语评测集（总时长只计 ASR 子集和 TTS 提示音频，其余子集的音频取自 ASR 子集，登记为它的子划分）：ASR 4,851 句 9.75 小时（上海话、苏州话及与普通话混说），
        吴语到普通话翻译 3,000 句，情感 1,000 句，性别 3,000 句，年龄 1,500 句，均为 16 kHz 单声道、Parquet 内嵌 WAV；
        另有 TTS 与 instruct TTS 的测试文本和提示音频。翻译、情感、性别、年龄子集的源句全部取自 ASR 子集（部分再切成更短片段，ID 带 _seg 后缀），不是独立的录音。
        与本项目 wenetspeech_wu 训练数据的关系：评测句本身不在训练集里，但 ASR 的 4,851 句来自 2,979 段长录音，其中 4,850 句
        所在录音的其他片段在 wenetspeech_wu@stepaudio2-wu-asr-full-v1-20261109 的训练切片里（共 573,287 条、1,174.4 小时，
        占训练 8,740.7 小时的 13%），说话人和话题与训练集重叠，用 WenetSpeech-Wu 训练过的模型在这里的成绩会偏乐观。
        Apache-2.0。
