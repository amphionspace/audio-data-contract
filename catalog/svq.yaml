      release_date: '2025-05-12'
      description: >-
        Google 发布的 Simple Voice Questions（MSEB 声音嵌入评测的核心数据），2.0.0 版：17 种语言、26 个地区口音（阿拉伯语埃及/海湾/黎凡特/马格里布、
        英语美/英/澳/印/菲、孟加拉、乌尔都等），759 位说话人（各地区分别去重后相加，发布方称约 700 位）用自己的手机朗读 XTREME-UP 问答数据里的短问句，171,434 条、244.4 小时。
        录音环境大致均分四种：clean（安静）、background_speech（旁边设备播放播客/电台）、media_noise（播放音乐影视）、traffic_noise（乘车途中），
        登记为四个划分。每条带参考文本（transcript_truth）、说话人编号、性别、年龄，以及段落检索、关键词时间戳等检索任务字段。
        发布方不分 train/test，整体作评测用；ASR 用途可评噪声与背景人声下的短句识别。只下载了 2.0.0 目录，1.0.0 的旧格式未下载。CC BY 4.0。
