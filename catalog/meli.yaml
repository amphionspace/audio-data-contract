        多连接下载频繁断开，2026-11-14 试下 80 分钟只得到约 1 GB，先登记来源；已下部分留在 /workspace/data/datasets/meli 供续传。
        许可证以 Dataverse 记录为准写 CC BY-NC-SA 4.0；语料自带 readme 写 CC BY 4.0，论文写 CC BY-NC 4.0，三处不一致，使用前需向作者确认。
