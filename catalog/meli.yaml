      description: >-
        UBC 语言学系 Speech in Context Lab 的 MELI（LREC 2026）：2024 年在温哥华录制的 51 位普通话-英语双语者，每人分别用普通话和英语
        做一场社会语言学访谈并朗读句子，普通话场次另有画地图任务。每人每种语言一个 44.1 kHz 16 bit 立体声 WAV，录音总长 42.5 小时
        （含采访者，论文称被试语音约 30 小时）。每个 WAV 配 Praat TextGrid（task、utterance-corrected、words、phones 四层，人工校正后
        用 Montreal Forced Aligner 对齐；普通话 TextGrid 是 UTF-16 编码），另有参与者语言背景表、地图扫描和文档。同一批说话人的
        中英两种语言都有，适合双语者、口音和中英语音对比研究。许可证以 Dataverse 记录为准写 CC BY-NC-SA 4.0；语料自带 readme 写
        CC BY 4.0，论文写 CC BY-NC 4.0，三处不一致，使用前需向作者确认。2026-11-14 起初直连源站只有约 10 KB/s，改经代理后下完。
