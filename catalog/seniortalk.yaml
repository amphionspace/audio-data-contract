      release_date: '2025-03-14'
      description: >-
        智源研究院与南开大学发布的超高龄老人中文对话语料：202 位 75–85 岁老人（来自 16 个省份，男女约 7:13），两两自由对话，
        手机在安静室内录制，110 段、55.5 小时，16 kHz，以双声道 WAV 内嵌在 Parquet 中。dialogue_data 每段的 text 是逐行 TSV：
        起止时间、说话人编号、性别、省份、口音轻重、转写，带 [NOISE]、[SONANT] 等事件标记，重叠处用 [+]…[+] 标出，可用于说话人日志
        和带说话人的转写；少数说话人编号格式不规范（如 38、035搁），读取时要规整成三位数。sentence_data 是按句切出的 ASR 子集
        （37.8 小时，60,029 句，平均 2.3 秒），音频取自同一批对话录音，但说话人划分和对话子集不同：抽查不少于 8 字的句子，
        sentence_test 里 2,735/3,287 句出现在 dialogue_train 的转写中，sentence_train 里 2,769/25,221 句出现在 dialogue_test 中，
        两套划分不能混用。仓库根目录另有一个 0 字节的 test 空文件。CC BY-NC-SA 4.0，仅限学术和非商业研究，发布方条款还要求
        不得再分发、参与者要求删除时须配合删除。
      license:
        - cc-by-nc-sa-4.0
