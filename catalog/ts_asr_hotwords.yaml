    description: TS-ASR + 热词评测集：从 ts-asr-benchmark@v12-20261022（中文）与 ts-asr-benchmark-en@v1-20261031（英文）的记录派生，沿用原音频（audio-index
      指向源文件）与目标；记录 id 加语言前缀。hotwords = 目标说话人转写里的热词；metadata.bias_lists：random = 正确词 + 随机词共 10 个，interferer = 正确词 + 其他说话人说出的热词
      + 随机词共 20 个（只在有人说了热词时给）；metadata.distractor_kinds 标出 interferer / random。抽样：含目标热词的记录全留，只有其他说话人热词的留 1/4，两者都没有的留 1/8。热词由
      amphiondata 的热词提取提示词经 Qwen3.8-27B 标注并复核，词必须在原文里出现。四个 split：zh-synthetic 7,794、zh-real 243、en-synthetic 4,126、en-real
      220。
    source: ts_asr_benchmark / ts_asr_real / ts_asr_nearfar / ts_asr_noise / ts_asr_farfield / ts_asr_shortseg / ts_asr_handover
      / ts_asr_nearshort (v12 and en-v1 versions)
    labels: 热词原始标注已登记为各源版本的 <dataset>@<v>-hotword-labels-20261102（metadata.hotword_labels，view <dataset>/hotword-labels）
    audit: datasets/ts_asr_hotwords/versions/v1-20261102/state.json
    known_issues: 英文合成场景的专有名词少（LibriSpeech/VCTK 朗读文本），英文正例只有 1,500 条左右；真实会议部分条数少（中英文各 200 多条）。
  recipe_parameters:
    builder: scripts/ts_hotwords/build_eval_set.py
    labeler: Qwen3.8-27B, amphiondata extract_hotword prompt + review pass
    random_list: 10
    interferer_list: 20
    keep_interferer_only: 1/4
    keep_plain: 1/8
