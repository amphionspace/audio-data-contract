      description: >-
        REAL-TSE 挑战赛（IEEE SLT 2026 卫星挑战赛）的目标说话人提取评测包：给定真实多人对话的混合片段和目标说话人的注册语音，
        恢复目标说话人的语音；没有干净参考，用目标说话人的转写算识别错误率评估。每个试次是一对混合片段和注册片段，多个试次可共用
        同一段混合音频；混合片段平均 17–18 秒，约一半时间有两人以上同时说话。dev 与 Interspeech 2025 论文的 PRIMARY 划分试次相同，
        eval1 取自同一批公开语料但会话不重叠，eval2 是新录制的中英文会议。全部为 16 kHz 单声道 16 bit WAV，每个试次附目标说话人
        转写（eval 的转写已按 Whisper large-v2 分词器重新规范化）和重叠时段 JSON。本发布 v1.0.1 只新增了挑战赛剔除样本表，音频和
        元数据与 v1.0.0（2026-08-23）相同。CC BY-SA 4.0；dev 和 eval1 派生自 AISHELL-4、AliMeeting、CHiME-6（CC BY-SA 4.0）、
