  provenance:
    summary: 说字写法合成训练数据（带 think）
    status: complete
    synthetic: full
    owner: mingdong
    description: >-
      说话人在一段话里用组词、拆字、偏旁结构或否定对比说明某个同音字怎么写（另含同名一致性），转写应按说明写字。
      沿用 context_correction_zh@v1-20261018 的流程：qwen3.6-plus 出题、deepseek-v4-pro 复核（6 项全过）、Qwen3-TTS 克隆音色朗读、
      SenseVoiceSmall 与 Qwen3-ASR-1.7B 拼音级质检（任一通过即可，按多音字全部读音比较）。音色取 aishell3、kespeech 训练划分的语句，
      排除评测集克隆过的说话人；题目避开评测集的被测词，与评测集写法对或朗读文本相同的进隔离区。每条 train / train_ts 记录在 think.jsonl.gz
      里有一行 think（context_correction_clean_zh 的 think 格式）。抽查：说明写错约 2–3%，只靠一个 ASR 通过的条目未见误收。
      起因：open-audio-llm runs/zh-spelling-think-20261113 中 think 有效，但真实说明样本只有 2,187 条。
    sources:
    - LLM-generated scripts (Aliyun Bailian qwen3.6-plus, reviewed by deepseek-v4-pro)
    - aishell3@legacy-20260804 train voices
    - kespeech@legacy-20260804 train voices
    - Qwen3-TTS-12Hz-1.7B-Base
    run_dir: /workspace/workspace/mingdong/data/amphiondata/spelling-synth-zh-20261114
# 占位登记：隐式语义的上下文纠偏训练数据（没有显式说明，同音词的写法由后文语义决定），生成中，进度见状态文件。
- schema_version: dataset-catalog/2.0
  dataset_id: context_correction_synth_zh
  version: implicit-v1-20261117
  languages:
  - zh
  tasks:
  - asr
  - ts_asr
  aliases: []
  artifacts:
  - name: preparation_state
    kind: dataset-state
    root_alias: aidc_data
    relative_path: datasets/context_correction_synth_zh/versions/implicit-v1-20261117/state.json
  splits:
    train:
      artifacts:
        preparation_state:
        - preparation_state
      provenance:
        preparation_status: building
  provenance:
    preparation_status: building
    owner: mingdong
    summary: 隐式语义的上下文纠偏合成训练数据
    description: >-
      train-v1-20261114 只有显式说字和同名一致性；这一版补隐式语义：同音的两个常见词（期中/期终、权利/权力），
      写法由后文语义决定。沿用 train-v1 的流程和音色（amphiondata scripts/context_correction/），出题和复核改用火山方舟
      （doubao-seed-2-1-pro 出题、deepseek-v4-pro 复核、glm-5-2 只看文字盲解），场景用与评测集 v1、v2 都不重合的话题 / 子话题种子，
      评测集 v1、v2 的被测词进回避列表，写法对或朗读文本与评测集相同的进隔离区。每条记录带线索 + 目标写法的 think。
      用于 open-audio-llm runs/zh-ctx-clue-target-20261117。
    source: LLM-generated scripts (Volcengine Ark), aishell3@legacy-20260804 / kespeech@legacy-20260804 train voices, Qwen3-TTS-12Hz-1.7B-Base
    run_dir: /workspace/workspace/mingdong/data/amphiondata/ctx-implicit-zh-20261117
