    summary: 合成说字数据的 TTS 声音做的 TS 场景（带孪生）
    status: complete
    synthetic: full
    owner: mingdong
    description: >-
      train-v1-20261114 的 train_ts 是训练里唯一用 TTS 声音的 TS 数据，目标每条都在场；open-audio-llm
      runs/zh-ctx-clue-target-20261117 第 4–6 问发现模型因此把 TTS 声音一律当成目标，在全合成的 police_scene_bench 场景 TS 上
      把对方的话也转写（目标不在场误出字 53/70）；去掉 train_ts 能修好场景 TS，但模型又拒收同一人的克隆声音
      （上下文纠偏 v2 的 TS 题 943/3672 输出空）。这一版照 ts_scene_pool alt-twins 的做法
      （scripts/ts_robust/build_ts_scene_pool.py --alt-twins --twin-share 0.3），只用 train-v1-20261114 自己的 284 个克隆音色：
      每条 train_ts 记录做一个在场场景，其他说话人取别的音色的片段（轮流说话时取 2–8 秒一段，场景不超过 30 秒；
      重叠时盖住目标的 40–100%），30% 的记录是孪生：同一场景换一个不在场音色的注册音频，答案为空。
      这样 TTS 声音既会是目标，也会是别人。记录只写片段的位置（metadata.scene），训练时在线混合，同 ts_scene_pool；
      audio-index 指向 train-v1-20261114 的音频，没有复制。在场场景沿用来源记录的 labels 和 think 行。
      生成脚本 open-audio-llm runs/zh-ctx-clue-target-20261117/scripts/build_synth_ts_twins.py（种子 20261121）。
    sources:
    - context_correction_synth_zh@train-v1-20261114:train_ts
    run_dir: /workspace/workspace/mingdong/repo/oal-clue-target/runs/zh-ctx-clue-target-20261117
  derived_from: context_correction_synth_zh@train-v1-20261114
