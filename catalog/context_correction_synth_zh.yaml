    summary: 上下文纠偏合成训练数据：隐式语义（带线索 + 目标 think）
    status: complete
    synthetic: full
    owner: mingdong
    description: >-
      train-v1-20261114 只有显式说字和同名一致性；这一版补隐式语义：同音的两个常见词（期中/期终、权利/权力），
      写法由后文语义决定。规则同评测集生成器：被测词放在前面，两条文字在被测词之前完全相同，复核要判前半句两种写法都说得通。
      沿用 train-v1 的流程和音色（amphiondata scripts/context_correction/），出题和复核改用火山方舟（doubao-seed-2-1-pro 出题、
      deepseek-v4-pro 复核）；试跑中盲解筛掉的题以误杀为主，全量不用盲解。场景用 15 个话题、75 个子话题种子，与评测集 v1、v2 和
      train-v1 都不重合；评测集 v1、v2 的被测词进回避列表，写法对或朗读文本与评测集相同的进隔离区，同一写法对最多收 3 对。
      1,980 对收 854 对（542 个写法对），TTS 1,708 条，SenseVoiceSmall 与 Qwen3-ASR 任一通过 1,685 条。每条 train / train_ts
      记录在 think.jsonl.gz 里有一行线索 + 目标写法的 think，think-no-explanation.jsonl.gz 是固定句对照。
      用于 open-audio-llm runs/zh-ctx-clue-target-20261117。
    sources:
    - LLM-generated scripts (Volcengine Ark doubao-seed-2-1-pro, reviewed by deepseek-v4-pro)
    - aishell3@legacy-20260804 train voices
    - kespeech@legacy-20260804 train voices
    - Qwen3-TTS-12Hz-1.7B-Base
    run_dir: /workspace/workspace/mingdong/data/amphiondata/ctx-implicit-zh-20261117
