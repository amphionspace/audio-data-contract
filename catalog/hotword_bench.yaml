    status: complete
    synthetic: partial
    usage: evaluation_only
    description: 热词评测集，只用于评测，不进训练。每条记录存好固定的热词列表（metadata.bias_lists，已打乱顺序），评测器另跑不给列表的 none 条件。中文列表 = 正确词 + doubao-seed-2-1-pro-260915 生成、deepseek-v4-pro-ga-260813 复核的易混词 + 同 split 热词池随机词，补到 50 个；*_no_gold 为同一批干扰词去掉正确词。AISHELL1-NE、LibriSpeech 另含官方列表。生成脚本 scripts/hotword_bench/。
    sources:
    - aishell@legacy-20260804 + SeACo-Paraformer 855b0fb (Test/Dev-AISHELL1-NE)
    - ContextASR-Bench 7906fd9 Speech-Mandarin (MIT)
    - speechio@eval-original-20261011, wenetspeech@eval-20261011 (real_zh)
    - commonvoice_zh_hotwords, aishell2_hotwords, aishell3_hotwords, kespeech_hotwords, commonvoice_en_hotwords @hotwords-v1-20260805
    - gigaspeech@legacy-20260804 (test + XL training word counts)
    - librispeech@legacy-20260804 + fbai-speech is21_deep_bias 43cdb3c
    limitations: contextasr_speech_zh 为 TTS 合成音频；GigaSpeech 列表按 SALMONN-2 的描述重建，与其原表不完全相同；打分口径（规范化、B/U 归属）与各论文不完全一致，与公开数字只能近似对照；本地热词集与 real_zh 的 正确词来自 LLM 抽取。AISHELL-1/AISHELL-3 测试文本大量出现在 AISHELL-2 训练转写中，labels.train_text_overlap 标出与训练文本相同的条目，用过这些训练集的模型应看 none 子集。
