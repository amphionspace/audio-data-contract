      url: https://huggingface.co/datasets/apptek-com/apptek_callcenter_dialogues
      download_mirror: https://hf-mirror.com
      release_date: '2026-04-23'
      description: >-
        AppTek 2026 年发布的英文呼叫中心长对话评测集，873 通电话、合并后 151.1 小时（发布方统计语音 128.6 小时），每通 5–15 分钟，
        14 个口音组（澳、加、中、英格兰、苏格兰、威尔士、爱尔兰、印度、墨西哥、新加坡、美国非裔、美国通用、美国南方、南非），
        16 个服务领域，坐席和客户两人对话，在受控条件下录制。两种配置：test 把每通电话拆成两条单声道音轨，各有一整段逐字参考文本
        （保留 (um) 等语气词和 ~ 标出的断词），发布方建议用 Silero VAD 切段后按 Whisper 规范化算 WER，附 score.py；
        diarization 把双方合成一个文件，给出带说话人、角色、性别的时间戳分段（94,679 段），可评测说话人日志和带说话人的转写。
        两种配置是同一批电话，test 登记为 diarization 的子划分，不重复计时。仓库中部分 metadata.jsonl 因镜像返回不实的 gzip 压缩头，
        改用 curl 下载并按上游 git 哈希校验。CC BY-SA 4.0。
