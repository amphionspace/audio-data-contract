    description: >-
      马里兰州议会（Maryland General Assembly）委员会法案听证的转写评测集，音频取自议会官方 YouTube 频道的听证录像：
      71 场听证、19 个委员会，按停顿切成约 2 分钟的片段，共 2,834 段、95.65 小时，16 kHz 单声道 FLAC（与 MP4 视频片段同存于 parquet）。
      真实会议场景：议员、证人、工作人员轮流发言，有专名（议员姓名、法案编号）与数字，803 段标为多人重叠说话。
      只下载 100h 配置（它包含 10h、1h 两个配置的全部样本），不下载 96 GB 的原始整场视频。
      转写分两类，用 label_source 区分：human 300 段（10.20 小时，即 10h 配置）由两三个商用模型初稿、按分歧逐处人工听音核对改写，可作人工转写；
      auto_3model_rover 2,534 段（85.45 小时）是 mai-transcribe-2、gemini-3.5-transcribe、Nemotron-3.5-Transcribe 三模型 ROVER 共识，
      未经人工核对（agreement_score ≥ 0.85），相当于模型伪标签，用作训练前须按 AmphionData 规则另行清洗。
      CC0（州政府发布）。
