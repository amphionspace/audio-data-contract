    description: >-
      西波希米亚大学的 UWB-ATCC：捷克空域真实的管制员与飞行员无线电通话，英语（非母语口音为主），人工转写并按说话人角色
      标注。这里是 Idiap 为 ATC 语音识别基准整理上传到 HF 的版本：按说话人段切好，id 末尾 _AT 是管制员、_PI 是飞行员、
      PIAT 是两者同段；文本已规范化。实测音频是 8 kHz 单声道 16 bit（卡片特征写 16 kHz，与实际不符），共 14,113 段、
      13.0 小时，少于语料主页的 20 小时。划分不是随机的：test 全部是塔台（TWR）录音，train 是区域管制（ACCU）、进近（APP）
      和少量塔台，两边有 1 条录音重叠。信道窄带、噪声和失真都很重，适合嘈杂无线电通话和专业术语场景的识别评测。
      许可证按 LINDAT 原始语料写 CC BY-NC-SA 4.0；LINDAT 原站本机直连和走代理都连不上，暂时没有核对原始发布。
    license:
      - cc-by-nc-sa-4.0
