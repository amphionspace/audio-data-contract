  provenance:
    status: complete
    synthetic: partial
    summary: 伪造语音检测评测集（SpoofRadar、DF-Arena）
    description: SpoofRadar v1.0 与 Speech-DF-Arena 两个伪造语音检测排行榜使用的 16 个公开评测集，只用于评测，不进训练。每条记录的 target 为 bonafide（真人）或 spoof（伪造），metadata.protocols 保留两个榜单 protocol 中的原始样本 ID，可直接生成提交用的打分文件。官方 protocol 原样保存在 source/protocols/。各数据集许可证不同（ADD、Codecfake 为 CC BY-NC-ND 4.0，XMAD-Bench 为 CC BY-NC-SA 4.0），仅限内部研究评测，不得再分发。
