      这一版按用户 2026-11-23 的要求为这 5 条指令新写训练句（与警务 train/dev/test 文本去重，说话人只用 train 口音参考）。
      与 police_text_gaps_train 分开登记：训练时加上它，V6 测试集这 5 组就变成见过的指令，测试结果要分开看。
