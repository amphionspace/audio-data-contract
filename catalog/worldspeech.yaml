    provenance:
      summary: 台湾立法院与英语国家议会语音（WorldSpeech）
      source: Hugging Face
      source_id: disco-eth/WorldSpeech
      revision: b76b85395039f50332fbc421f7c098ee2f2653d7
      url: https://huggingface.co/datasets/disco-eth/WorldSpeech
      paper: https://arxiv.org/abs/2605.09167
      download_mirror: https://hf-mirror.com
      release_date: '2026-04-28'
      license:
        - cc-by-nc-4.0
      description: >-
        ETH Zurich 2026 年发布（NeurIPS 2026），全集 65,072 小时、88 种语言，来自各国议会、公共广播等机构的正式讲话；文本取自
        人工转写的会议记录，用 ASR 对齐切段，每段带 CER（对 ASR 结果）、WADA-SNR、DNSMOS，发布时已滤到 CER ≤ 0.30。本地只下了
        与本项目相关的 9 个配置，共 6,741.7 小时：zh_tw 台湾立法院 IVOD 1,443.9 h；英语 8 个议会 5,297.7 h，即美国众议院
        3,712.1 h、澳大利亚 568.4 h、新西兰 435.7 h、赞比亚 291.3 h、肯尼亚 169.9 h、塞拉利昂 102.3 h、牙买加 9.6 h、
        巴基斯坦旁遮普省 8.4 h。24 kHz Ogg Opus，en_us 和 en_pk 为单声道，其余英语为双声道，zh_tw 两者约各半。没有说话人标签。
        CER 中位数：美澳新牙约 0.06–0.07，塞拉利昂、赞比亚、肯尼亚 0.14–0.18，巴基斯坦 0.21，zh_tw 0.22，后几者文本与语音
        出入较大。已知问题：zh_tw 有完全重复的行（音频和文本都相同），train 31,791 行（135.1 h）、test 1,674 行（7.1 h），
        language 字段混用 zh 和 Mandarin Chinese (Taiwan) 两种写法；zh_tw 367 行、英语 7 行音频被截断（标称 20 s，实际只有
        1–8 KB，无法解码），统计时长时不计；en_au、en_nz 的 segment_id 不唯一（不同音频共用编号）。各配置 test 的源录音
        几乎都也出现在 train 中（zh_tw 9,406 个中有 9,196 个），是按片段而不是按会话划分，不能当独立评测集。yue_hk 与已登记的
        legco_speech 同源，没有下载；es、pt 由另一条工作线处理，其余语种不在范围内。CC BY-NC 4.0，不能商用，各来源条款更严时
        以来源为准。
      download_scope: WorldSpeech zh_tw and the eight English configurations (en_us, en_au, en_nz, en_zm, en_ke, en_sl, en_jm, en_pk), train and test Parquet, plus README
