        所以这份 test 只能衡量对新说话人的泛化，不能衡量对新文本的泛化，语言模型也可能直接记住这些句子。另有一个同名、体积相同的更早仓库 Kennethdot/
        Ghana_English-Twi_Code-switching_Speech（2026-08-05），未逐文件比对。Apache-2.0。
