  provenance:
    summary: AR 眼镜嘈杂餐厅多人对话（EasyCom）
    source: GitHub release
    source_id: facebookresearch/EasyComDataset
    revision: v1.0.0
    url: https://github.com/facebookresearch/EasyComDataset
