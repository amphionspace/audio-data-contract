  provenance:
    summary: AR 眼镜嘈杂餐厅多人对话（EasyCom）
    source: GitHub release
    source_id: facebookresearch/EasyComDataset
    revision: v1.0.0
    url: https://github.com/facebookresearch/EasyComDataset
    paper: https://arxiv.org/abs/2107.04174
    release_date: '2021-06-24'
    license:
      - cc-by-nc-4.0
    description: >-
      Meta Reality Labs 的 EasyCom：嘈杂餐厅环境下围桌进行的英语自然对话（自我介绍、点餐、游戏等任务），一人佩戴带 6 麦克风
      阵列和广角摄像头的 AR 眼镜，其余参与者各戴近讲麦克风，周围扬声器播放餐厅噪声，有一名服务员参与。Main 是 12 场会话、
      323 个 1 分钟片段，眼镜阵列音频共 5.30 小时（6 通道 48 kHz 32 位整型，含 2 个入耳双耳麦），近讲音频按参与者分文件
      （753 个，单通道 48 kHz 32 位浮点，实际采样率约 48,008.6 Hz，各会话略有差异）；人工转写 6,981 句，带说话人编号
      （每场 1–7 号，按角色或座位分配，不能跨会话当作同一人，共 52 个会话-参与者组合）、起止时间（按 20 fps 视频帧计）和说话对象，
      转写含 [L] 笑声、[H] 犹豫、[U] 听不清等标记；另有头部位姿、人脸框、视频和参与者照片。Extra 是 3 场有小问题的会话、
      77 个片段、1.28 小时，没有转写。官方 v1.0.0 发布是 33 个分卷 tar.gz，使用前需按顺序拼接后解压（约 70.8 GB，其中视频
      45 GB）。15 个转写 JSON 不是合法 UTF-8，读取时需按 Latin-1 或 cp1252 解码。CC BY-NC 4.0。
    download_scope: Official v1.0.0 release (33 split tar.gz parts with audio, video, transcripts and annotations)
