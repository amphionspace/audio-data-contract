      description: >-
        俄勒冈大学 Corpus of Regional African American Language v2023.06：8 个地区组件、271 段社会语言学访谈录音、160.9 小时、226 位说话人，
        44.1 kHz 单声道 WAV，录音年代从 1966 到 2019 年。每段有带时间戳和说话人的人工逐句转写（textfiles、Praat TextGrid、ELAN 三种格式），
        元数据表给出说话人性别、年龄组、出生年份、受教育程度、职业等社会背景。真实的长篇自然对话，包含方言语法和发音，是检验英语 ASR
        在非标准口音和老旧录音上表现的常用长音频评测（Open ASR Leaderboard 的长音频项也用到它），也可用于训练。官方没有公布哈希，
        下载时对每个压缩包做了完整 gzip 校验。官方文件清单里 LES、VLD 两个元数据文件的链接写错了版本号，已改用实际的
        *_metadata_2021.07.txt；VLD 元数据里的 VLD_se0_ag2_f_01_2 实际音频名为 VLD_se0_ag3_f_01_2。CC BY-NC-SA 4.0。
