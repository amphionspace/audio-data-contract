    - 日语通常按字计分（CER）；当前 ts-asr 评测器（打分口径 v3）对中英文以外的语言按空格分词，日语里汉字一字一个单位、连续假名合成一个单位，日语错误率不能直接比较，需先改评测器。
    - Casablanca 音频多为 44.1/48 kHz 双声道（电视音轨），保持原样；评测器读取时取声道平均并重采样到 16 kHz。
