    owner: mingdong
    description: common_voice_es@cv27-train-v1-20261111 里有热词的行（469,488 条，全部 clean 通过）的热词训练版本：每行一条 asr_hotwords 记录，文本、热词与父版本相同，metadata.confusable_hotwords 为读音相近的真实西语热词，训练时按 hotword_confusable_prob 作为干扰词放进列表（同 police_terms_single_train@hotwords-confusable-v1-20261102）。近音词检索复用评测集 hotword_bench@es-v1-20261111 的西语读音键（拉美读法：seseo、yeísmo、b/v、h 不发音等）与编辑距离，每个热词最多 3 个，读音最近的优先；词库只用 CV es / MLS es 训练集（es-train-v1）与 CV 27.0 增量的热词标注（120,633 个），去掉了评测集三个 split 的全部正确词。剔除两类候选：与本条热词只是同一个词不同写法的（读音键忽略空格、ñ/ny/gn 与 n、y 与 i 不区分后相同，如
      Sara/Sarah、Cataluña/Catalunya、España/espana、Monte Verde/Monteverde，当负例会教模型拒绝与录音一致的写法），以及出现在本条文本里的。310,629 条（66.2%）有近音词，平均每条 3.201 个；近音词与评测正确词重叠 0。录音不复制，audio_index 指向 mdc-27.0 源文件。检索结果见 mined/confusables.jsonl.gz，质检与 20 条样例见 qc.yaml。
    sources:
    - common_voice_es@cv27-train-v1-20261111
    - hotword_bench@es-v1-20261111 (gold words excluded from the vocabulary)
    scripts:
    - scripts/hotword_bench/build_es_train_confusables.py
    - scripts/hotword_bench/recipe-cv27-es-train-hwconf-v1.yaml
    limitations: 近音词按拼写推出的读音键检索，不是声学相似度，也不覆盖英文专名的英语读法；词库只收标注里出现至少两次的词，仍有重复出现的 OCR / 拼写错误词（如 Ingalaterra、jesuchristo），也有同一人名的历史写法（Moctezuma/Montezuma），按规则分不出来；热词是 LLM 抽取、未经人工核对。
