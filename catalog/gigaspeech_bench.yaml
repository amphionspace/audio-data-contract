    provenance:
      summary: 多方言多语种 ASR 评测（GigaSpeechBench）
      source: Hugging Face
      source_id: speechcolab/GigaSpeechBench
      revision: 55ce5222f21f314759f5bfe8212eff34cd730aa2
      url: https://huggingface.co/datasets/speechcolab/GigaSpeechBench
      download_mirror: https://hf-mirror.com
      release_date: '2026-06-26'
      description: >-
        SpeechColab 2026 年发布、2026-11-12 改为 WebDataset 打包的 ASR 评测集，只有 test，54 个配置、36,340 条录音、903.6 小时录音，
        其中有标注的语音段 498,442 段、691.6 小时。四个模块：汉语方言与口音英语（12 组）、低资源语种（14 组）、老人与儿童（4 组）、
        垂直领域（24 组，中英各 12 个领域）。录音保持原样不切分（16 kHz 单声道 WAV），同名 JSON 里给出整段的分段转写、起止时间，
        多数配置还有说话人、性别、年龄段、情感；低资源语种每段另附英文和中文译文；部分英文转写用 (overlap) 标出重叠。
        GigaSpeech 3 的数据卡称阿拉伯语方言部分为人工转写评测。与本项目已有评测的重叠：WU 配置的 4,851 段即 wenetspeech_wu_bench
        的 ASR 子集（文本全部一致），YUE 配置的 8,807 段即 WSYue-ASR-eval（wenetspeech_yue 的 test_short/test_long，时长逐段对上 8,805 段，
        文本转成了简体），横评时不要重复计入。各配置另附 Azure、Qwen3-ASR、Gemini 等十余个系统的转写结果（results/*.json）。
        镜像对部分 JSON 返回了不实的 gzip 压缩头，这些文件用 curl 下载并按上游 git 哈希校验。CC BY 4.0。
